schema = 1
id = "asteroids/ship-fire"
target = "asteroids-discrete"
duration_s = 2.0
description = "One ship fire chirp, its enable held the fourteen frames the game holds it"

# PULSED, and the length is the game's own. This file used to hold the line for
# the whole run and say so as a modelled limitation: the old chirp was a linear
# frequency ramp times an exponential envelope, both driven off the enable LEVEL,
# so a short trigger truncated it and there was nothing else to do.
#
# The voice is now the board's, which made the question answerable rather than
# awkward. Tracing every write to the 74LS259 through a real shot
# (tools/script/examples/asteroid_fire_trace.rhai) shows the game rewrites the
# whole latch every frame and holds line 4 for fourteen of them, about 230 ms,
# whether the button is tapped for two frames or held for forty. It is the
# game's timer and not the player's finger.
#
# The length matters to what this voice IS. Held, its pitch capacitor fills all
# the way to the source transistor's saturation and the 555 settles into a
# steady low buzz that never stops, because nothing in the circuit ends it. The
# reference goes quiet instead, but for a reason that is not a mechanism: its
# duty is fitted as 4500/f + 67, which crosses 100 % at 136 Hz and stops making
# edges. Comparing a held run therefore compares our capacitor against the
# reference's arithmetic running off the end of its own fit, and neither is the
# sound the game makes.
[[action]]
at_s = 1.0
control = "ship-fire"
value = true

[[action]]
at_s = 1.23
control = "ship-fire"
value = false

# From 50 ms before the trigger, which is where every scenario on this board
# starts, and ending 70 ms after the release. The gate edge is inside the window
# at both ends on purpose: the release is where the two analog switches restore
# both capacitors and the 555 goes back into reset, and that is a real event
# with a real shape rather than a fade-out.
#
# Not longer. Both sides are digitally silent after the release apart from the
# mix coupling capacitor's own recovery, and a window carrying a second of that
# reports the silence rather than the effect.
[analysis]
start_s = 0.95
end_s = 1.30
