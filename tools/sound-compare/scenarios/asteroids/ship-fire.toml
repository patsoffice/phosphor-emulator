schema = 1
id = "asteroids/ship-fire"
target = "asteroids-discrete"
duration_s = 3.0
description = "One ship fire chirp, its enable held for the whole sweep"

# HELD, NOT PULSED, and that is a modelled limitation rather than the board's
# behaviour. The chirp's sweep and its amplitude decay are both driven off the
# enable LEVEL: the envelope component returns zero the instant the line drops, so
# a 50 ms trigger truncates a chirp that should run about 280 ms. Its own `active`
# flag is set on the rising edge and then never read, which is what a one-shot
# that lost its one-shot looks like.
#
# So this scenario holds the line, because that is the only way to see the whole
# chirp the model can make, and the matching reference driver holds it too so both
# sides describe the same event. It is NOT evidence that the board holds it. When
# the trigger discipline is settled against the netlist, this file and the driver
# change together, and the change will be visible as a change here rather than as
# a quiet shift in a number.
[[action]]
at_s = 1.0
control = "ship-fire"
value = true

# Measured from just before the trigger, because the attack is the part under
# test. The window runs to the end of the run so the whole decay is inside it,
# rather than cutting the tail and putting the cut into every level measured from
# it. The enable is never released, so no hard-gated silence enters the window
# either; what the tail holds is the envelope's own decay.
[analysis]
start_s = 0.95
end_s = 3.0
