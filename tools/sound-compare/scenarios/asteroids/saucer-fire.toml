schema = 1
id = "asteroids/saucer-fire"
target = "asteroids-discrete"
duration_s = 2.0
description = "One saucer fire chirp, its enable held the fourteen frames the game holds it"

# Pulsed for the same reason and to the same length as the ship's, and the note
# in ship-fire.toml applies here unchanged. The two circuits are identical parts
# for parts apart from four components, and the game's fire timer is the same
# routine, so the same fourteen frames are used here; the ship's is the one that
# was traced, because a shot can be fired on demand where a saucer's cannot.
#
# Worth keeping separate from the ship's despite sharing a builder: the four
# components that differ are what make one a "pew" and the other a "pip". The
# saucer charges its pitch capacitor twelve times more slowly, so the same
# fourteen frames cover a fifth of the pitch span, and it empties its output
# capacitor through 10 kΩ where the ship uses 2.7 kΩ.
[[action]]
at_s = 1.0
control = "saucer-fire"
value = true

[[action]]
at_s = 1.23
control = "saucer-fire"
value = false

[analysis]
start_s = 0.95
end_s = 1.30
