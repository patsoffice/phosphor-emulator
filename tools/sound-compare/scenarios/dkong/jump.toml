schema = 1
id = "dkong/jump"
target = "dkong-discrete"
duration_s = 3.0
description = "One jump, triggered once and allowed to decay completely"

# Edge-triggered one-shot: a single narrow pulse. Re-pulsing would overlap
# decays and make the envelope and integrated energy unmeasurable.
[[action]]
at_s = 0.5
control = "jump"
value = true

[[action]]
at_s = 0.55
control = "jump"
value = false

[analysis]
start_s = 0.45
end_s = 3.0
