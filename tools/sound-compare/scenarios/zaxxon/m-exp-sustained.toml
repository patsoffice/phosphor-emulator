schema = 1
id = "zaxxon/m-exp-sustained"
target = "zaxxon-discrete"
duration_s = 6.0
description = "The ship explosion retriggered, which is how the game plays it"

# `zaxxon/m-exp` fires U21 half B once, and a single trigger is a 43 ms pulse
# followed by a 2.0 s exponential: the voice decays from its first instant.
# MAME's 10.wav does not do that. `disasm audiodiff` puts its attack at 0.99 s
# against 0.27 s for the single-trigger capture, which is a sustain, and no RC
# recovery produces one.
#
# The reason is that the 74123 is RETRIGGERABLE and the game retriggers it. Two
# voices in the reference driver carry a `!playing()` guard, M-EXP and ALARM3,
# and a guard that suppresses a restart only exists because restarts happen.
# While the pulses keep arriving the one-shot never finishes, D8 holds C63 down,
# and the VCA stays open; when they stop, the 2.0 s recovery runs. That recovery
# is measurable and it is right: audiodiff puts the reference's decay tau at
# 0.902 s and this capture's at 0.921 s.
#
# TWO NUMBERS HERE ARE STIMULUS RATHER THAN CIRCUIT, and neither is read from
# the ROM. The 35 ms period is inside the one-shot's 43 ms so the pulse is held,
# with enough margin that sample quantization cannot let it lapse. The one
# second of pulsing is taken from the reference's 0.99 s attack, which is using
# a recording to choose a stimulus rather than to set a constant: what the board
# does with the pulses is the circuit, how many the game sends is the game's,
# and nothing in `machines/src/zaxxon_sound.rs` moved for either.

