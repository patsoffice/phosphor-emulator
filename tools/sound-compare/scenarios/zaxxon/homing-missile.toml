schema = 1
id = "zaxxon/homing-missile"
target = "zaxxon-discrete"
duration_s = 3.0
description = "The homing missile: U6's 555 swept through its control-voltage pin"

# Held for two seconds, which is thirty periods of the warble, because the
# warble is the voice. U5 free-runs at 15.4 Hz whether or not the gate is open
# and the gate is only the 4016B's switch, so what a capture has to show is a
# repeating sweep across the whole hold rather than a transient at its start.
# Two seconds is also what makes a capture that ends one way round comparable
# with one that ends the other.
[[action]]
at_s = 0.5
control = "homing-missile"
value = true

[[action]]
at_s = 2.5
control = "homing-missile"
value = false

[analysis]
start_s = 0.45
end_s = 3.0
