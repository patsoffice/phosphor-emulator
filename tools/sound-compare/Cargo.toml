[package]
name = "phosphor-sound-compare"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sndcmp"
path = "src/main.rs"

[dependencies]
phosphor-core = { path = "../../core" }
phosphor-machines = { path = "../../machines" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
