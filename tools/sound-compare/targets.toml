[[target]]
id = "btime-output"
machines = ["burgertime"]
status = "missing"
notes = """
EXAMINED. Off `unexamined` as `missing`, and the finding is structural rather
than a filter value.

THE BOARD DOES NOT SUM THE TWO CHIPS. Each AY-3-8910 brings its three analog
channels out on pins 4, 3 and 38. Five of the six tie to one bus. The sixth,
9F's channel A, CROSSES THAT BUS WITHOUT CONNECTING and goes off alone into a
two-pole multiple-feedback band-pass, then back into the mixer at higher level
and OPPOSITE POLARITY, its path being inverted twice where the bus path is
inverted once. The crossing was checked at pixel level: 9F channel A passes the
bus vertical with no dot, and 9F channel B one wire below meets it with a solid
one.

That is not expressible today, and not because of an omission in this board
file: `Ay8910::fill_audio` already sums a chip's three channels internally, so
the per-channel outputs the board needs do not exist at the device boundary.

THE FILTER IS A BAND-PASS, NOT A LOW-PASS. R51 1k, R50 10k to ground, C27 and
C28 0.068 uF, R49 4.7k feedback: f0 1.13 kHz, Q 1.14, gain at f0 -2.35. The same
parts read as a low-pass give a corner near 500 Hz, which is what a first pass
produced and it was wrong.

THE COUPLING CAPACITOR IS C21 100 uF, which this note used to say was not on a
schematic to hand. Into a nominal 8 ohm speaker that is 199 Hz, twenty times the
`DcBlocker`'s shared 10 Hz default. Also unmodelled: a VR1 10k volume pot, the
1181 power amplifier, and a ferrite bead with two capacitors at the speaker pin.

CONFIRMED RATHER THAN REFUTED: coupling AFTER the sum is right. C25 and C21 are
both between the chips and the speaker and neither is inside either chip, which
is what the old comment reasoned without a drawing. Its corner is wrong; its
position is not. Also, VR1 does NOT move a filter corner, which is worth
recording because the volume control does on four other boards in this sweep.

Transcribed at docs/schematics/btime-audio-output.md. Tracked as
phosphor-emulator-jenz. The scan is
archive.org/items/arcademanual_BurgerTime/BurgerTime.pdf, sheet 9-3 across PDF
pages 68-70, with the audio on page 69."""

[[target]]
id = "ccastles-output"
machines = ["ccastles"]
status = "missing"
notes = """
EXAMINED. Atari SP-241 sheet 8B, block `Audio Output`, and sheet 2A for the
amplifier board, transcribed at docs/schematics/ccastles-audio-output.md. The
row's own guess was right: there IS a summing amplifier after the POKEYs, and it
is now read.

TWO OF THE MODEL'S THREE CLAIMS ARE CONFIRMED, which is why this is the smallest
of the three Atari rows read in this pass.

- THE 1:1 SUM IS THE BOARD'S. R121 and R122 are both 100k into R123 62k, so
  `samples1 + samples2` weights the two chips exactly as the board does. Eighth
  confirmation in this sweep.
- THE COUPLING CAPACITOR IS REAL AND IN THE PLACE THE COMMENT SAYS. C31 and C37,
  0.22 uF, sit ONE PER CHIP ahead of the summing resistors rather than one behind
  the sum, but both work into 100k, so both corners are 7.23 Hz and by
  superposition one high-pass on `a + b` is the same filter as one on each. Only
  the corner is off: 7.23 Hz against the DcBlocker's 10 Hz default. Same shape as
  Mr. Do's finding.

WHAT IS MISSING is a voltage gain of about 4.55 per chip (220 ohm into a virtual
ground at the net AREF with 1k of feedback, package 5B on a +12 V single supply);
an antiphase output pair through R130 and R133 2.2k to J20; and the
Regulator/Audio II PCB 035435-01 rev F, two TDA2002A channels into two speakers
where this model is mono.

A NEGATIVE WORTH KEEPING: C30 and C35, 0.01 uF at each POKEY pin, are a low-pass
at AT LEAST 72.3 kHz, because R108 runs into a virtual ground. Missile Command's
same two parts in the same two places sit at least 159 Hz. Do not model this one.

NOT READ: which of pokey1 and pokey2 is 3D, which does not matter here because
the two chains are identical part for part. No measurement.

SCAN NOTE. The schematics are the last third of CCastles.pdf, not a separate
package: page 63 is the supplement cover, sheet 1A is page 64, each side advances
one page. Crystal-Castles-2board-schematic.pdf is a different two-page drawing of
