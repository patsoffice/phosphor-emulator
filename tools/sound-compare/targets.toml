[[target]]
id = "mariobros-discrete"
machines = ["mariobros"]
device = "machines/src/mario_sound.rs"
adapter = "mariobros-discrete"
status = "implemented-needs-validation"
scenarios = ["mariobros/walk1", "mariobros/walk2", "mariobros/skid"]
notes = """
Two footsteps, the skid, and the music through two LM3900 sections. The trigger
