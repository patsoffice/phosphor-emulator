[[target]]
id = "toobin-output"
machines = ["toobin"]
device = "machines/src/atari_jsa.rs"
status = "partial"
notes = """
EXAMINED AND BUILT FROM THE DRAWING. Transcribed at
docs/schematics/toobin-audio-output.md from SP-320 sheets 21 and 22, and
machines/src/atari_jsa.rs now implements the output stage rather than a wire
with two volume taps on it. `partial` and not higher because the board is
stereo and the model downmixes to mono, and because nothing has been compared
against a reference.

MODELED, with every constant taken off the board:

- Both volume ladders. They are binary-weighted CD4066 switches summing into an
  LM324 virtual ground, so each is linear in its code, and the two feedback
  resistors fix the ratio between the sources: 12k/30k per step for the YM2151,
  reaching 2.80 at code 7, and 47k/150k per step for the POKEY, reaching 0.94 at
  code 3. This RETIRED a fitted 3.0 that had been standing in for that ratio.
  The fitted value turned out to be within a percent of the board's, which is
  luck and is recorded as luck.
- The POKEY's routing, which is a mute and not only a placement. The POKEY and
  speech are summed first, then injected into each channel through a 12k leg
  gated by one of the YM2151's CT1/CT2 pins. Clearing both takes the POKEY off
  both speakers at any volume code. Ym2151 gained ct1()/ct2() accessors for
  this, and harness/tests/boot_check_test.rs asserts the game actually drives
  them, since a mute here is invisible in a mixed buffer.
- The switched low-pass, as two cascaded one-pole sections: a fixed 6.0 kHz pole
  across the output amplifier's 12k feedback, and a shunt that moves from
  13.3 kHz to 3.6 kHz when a transistor switches a second 0.0027 uF in. Its base
  is driven from the mix register's LPF bit OR from YM0, the bottom bit of the
  YM volume field, so the corner also drops whenever that code is odd. That
  second path looks like an accident of the design and is flagged in the
  transcription for a second reading.

STILL NOT MODELED:

- Stereo, and the collapse is OURS rather than the board's, in two places. The
  Ym2151 core already returns a single stream: it sums all eight FM channels and
  never reads their per-channel left/right enable bits, so the FM's panning is
  gone before this board model sees a sample. On top of that the two channel
  mixers become one here. Recovering any of it starts in the YM2151 core.

  BUT IT COSTS TOOBIN' NOTHING, measured over 2950 frames of recorded play
  covering attract, a coin and real gameplay: all eight FM channels are centered
  in every frame, and CT1/CT2 are both set in every frame. Both sources are
  identical on the two speakers, so the mono sum is what this board produces
  rather than an approximation of it. The stereo work is for the rest of the
  JSA-I catalog, not for this game.
- Absolute level. The board's RATIO is now right; whether our YM2151 and POKEY
  cores sit at the same relative scale as the chips do is unchecked, and that is
  what would turn the ratio into a calibrated level.
- The volume codes, the routing and the filter switch are sampled once per drain
  rather than per sample.
- The DcBlocker is still the shared default corner rather than this board's
  coupling.

Promote to `implemented-needs-validation` only with an adapter and scenarios.
Tracked as phosphor-emulator-fuqb.1."""
