This is the one entry that can never reach `validated` by the route every other
entry takes. If it is ever to move, it needs a different kind of evidence
entirely -- a surviving board, a photograph of one, or a recording made from
hardware -- and none of those is a schematic reading."""
notes = """
POKEY with no coupling or filter stage modelled.

What the code does is therefore all anyone has. Worth stating plainly so the next
reader does not go looking: the absence of an analog stage here is not a known
gap in the way Pac-Man's is, because nothing establishes what the board did."""

[[target]]
id = "irobot-output"
machines = ["irobot"]
device = "machines/src/irobot.rs"
status = "partial"
notes = """
EXAMINED. CPU PCB SP-251 sheet 4A, transcribed at
docs/schematics/irobot-audio-output.md.

THE FIRST ENTRY IN THIS SWEEP WHERE A CONSTANT WE ALREADY HAD IS RIGHT. The four
POKEY outputs on the 4E quad-POKEY, pins 28, 29, 27 and 21, are tied DIRECTLY
together with no summing resistors. Four equal-impedance outputs shorted together
average, so `mix_audio`'s `* 0.25` is what the board does. The comment beside it
credits the reference emulator's routing, which is true but is not the reason it
is correct; recorded because "borrowed and happens to be right" and "derived from
the board" read identically in code and are different claims.

WHAT IS NOT MODELLED is everything after that node: C9 0.22 uF shunting the
paralleled output to ground; a gain stage of about -4.5 (R20 1k against R19 220)
on an LM324; C8 0.22 uF coupling into a unity inverter; and then a second unity
inverter, so that AUD1 and AUD2 leave on connector pins 8 and 9 as A DIFFERENTIAL
PAIR where irobot.rs is mono. The LM324 runs single-supply on +10.3 V with an
AUD5V mid-rail bias from R276 100k and C31 0.47 uF, so its clipping is asymmetric
about that bias rather than about zero.

Neither capacitor's corner is established: both depend on impedances not on this
sheet. phosphor-emulator-2u1j."""

[[target]]
id = "missile-output"
machines = ["missile"]
status = "missing"
notes = """
EXAMINED. Off `unexamined` as `missing`: the model applies a shared `DcBlocker`
and a scale, and the board's whole analog path is absent.

POKEY pin 37 sits on R38 10k to +5V and C70 0.1 uF to ground, a low-pass. Then
N10 LM324 section a as a unity follower (pin 6 tied to pin 7; C75 is across the
+12/-5 supplies, not in the feedback), then two inverting sections at -1 each,
producing AUD 1 on J20 pin E and AUD 2 on J20 pin S. THE GAME PCB EMITS AN
ANTIPHASE PAIR and the model is mono. Nothing on the game PCB is AC-coupled: the
op-amps run split supplies with their + inputs at ground.

The pair drives the Regulator/Audio II PCB 035435-02, which Tempest also uses,
where each channel is a 1k-against-11k divider (-20.8 dB), a C6 0.22 uF coupling,
a TDA2002A at 1 + 220/10 = 23, a Boucherot cell, and a 1000 uF output coupling
into its own speaker: 19.9 Hz for a nominal 8 ohms. TWO SPEAKERS.

The `DcBlocker` here does correspond to a real part, C6 and C15, but they are on
the Regulator/Audio II board; the comment in `missile_command.rs` reads as though
the capacitor were on the game PCB, and it is not.

Transcribed with Tempest at docs/schematics/atari-pokey-audio-output.md. Tracked
as phosphor-emulator-hd8n. The schematics are a Drawing Package Supplement
appended to MissileCommand.pdf at PDF pages 59-63, after three manuals."""

