# Coverage catalog: every discrete or board-level analog audio path in the
# project, whether or not anything models it yet.
#
# This file exists because the plan kept losing things. `atari-system1-audio`
# below is the worked example: an implemented discrete device with no adapter,
# no scenarios and no mention in any phase of the epic, which nobody noticed
# until someone listed the sound devices and compared. A catalog that has to
# name a status for every path makes that a visible row rather than an absence.
#
# STATUSES, and what each one is claiming:
#
#   unexamined                    nobody has checked what this board's analog
#                                 path is; `notes` says what the code does today
#   missing                       the board has an analog path and we model none
#                                 of it
#   partial                       some of the path is modelled
#   implemented-unvalidated       a device exists but nothing has ever compared
#                                 it against a reference
#   implemented-needs-validation  compared against a reference, residuals
#                                 recorded, but not signed off against the
#                                 schematic
#   validated                     compared AND schematic-reviewed
#   blocked                       `reason` required
#
# NOTHING IS `validated` YET, deliberately. Several entries below have had far
# more work than that sounds: Donkey Kong and Asteroids were both rebuilt from
# their schematics stage by stage. But `validated` is a claim that someone
# checked the model against the drawing and signed it off, and promoting an
# entry is that person's to do rather than a bookkeeping default. A status that
# gets handed out by whoever last touched the file is worth nothing.
#
# THE FIRST SIX ARE ABOUT MODELLING; `unexamined` IS ABOUT REVIEW, and they are
# different axes. A board where a shared coupling stage is applied and no drawing
# has ever been read is technically `partial`, but calling it that claims a
# review nobody did. Every entry below the "Unexamined" heading is there because
# a machine exists and nothing has been established about its analog path -- not
# because anything is known to be wrong.
#
# `scenarios` lists ids that must exist in scenarios/. `adapter` is the sndcmp
# target id, present only where one is registered in src/targets/. Both are
# checked by the tests in src/catalog.rs, which also require that every
# REGISTERED MACHINE appears in some entry here.

schema = 1

