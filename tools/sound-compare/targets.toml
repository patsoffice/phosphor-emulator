[[target]]
id = "konami-output-filters"
machines = ["scramble", "scobra", "frogger"]
status = "missing"
notes = """
The discrete output-filter controls. Filter selection is latched but nothing
models what it switches. Phase 8 item 4.

This is the ONLY analog path these three boards have, and the row that used to
put Scramble and Scobra on the Galaxian sound board was simply wrong. They run
`KonamiSound`: a second Z80 with two AY-8910s behind an 8255 PPI, which is not a
discrete board and belongs in this catalog only for the filters that follow it.
Nothing had checked; `machines/src/scramble.rs` names the device in its imports."""
