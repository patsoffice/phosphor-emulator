# ---------------------------------------------------------------------------
# Unexamined: a machine exists, nobody has read its board's audio drawing
#
# Filed by phosphor-emulator-discrete-sound-fidelity-l5r3.10, which swept the
# registry rather than the source tree. Each row records what the code does
# today, from reading the code, and claims NOTHING about what the board does.
# Moving one off `unexamined` means reading a drawing.
#
# The recurring pattern to be sceptical of: many of these apply the shared
# `DcBlocker`, a one-pole coupling capacitor. That is a real part on most of
# these boards, but the value is generic and nobody has checked it against a
# schematic, nor whether the board also has the filter and amplifier stages that
# usually accompany it. A coupling cap alone is not an output stage.
# ---------------------------------------------------------------------------

[[target]]
id = "williams-output"
machines = ["joust", "robotron", "sinistar"]
device = "machines/src/williams.rs"
status = "partial"
notes = """
EXAMINED. D-8224-3006 sound board schematic, transcribed at
docs/schematics/williams-audio-output.md. One reading covers all three machines,
since they share the gen-1 board.

THE COUPLING CORNER IS A DEFAULT WHERE THE BOARD GIVES A NUMBER. `williams.rs`
builds `DcBlocker::new(1_000_000)`, taking DEFAULT_CUTOFF_HZ, a round 10 Hz
picked to be "low enough to pass the whole audible band untouched". The board has
TWO couplings: C14 1000 uF into an 8 ohm speaker, which is 19.9 Hz and is
computable, and C12 1 uF ahead of the power amplifier, whose corner needs IC1's
input impedance and is not computable from this sheet. `DcBlocker::with_cutoff`
already exists, so the first is a one-line change from a default to a derived
value. Neither is a large effect on most material; that is the honest framing.

ALSO UNMODELLED: Q2, a 2N4401, on the MC1408's current output with R26 3.3k and
C29 10 uF, so the DAC does not drive the amplifier directly; an EXTERNAL volume
control on connector J4 through R11 5.6k and R12 1k, where the model has no
volume at all; IC1's gain of about 100 from R17 220 against R16 2.2, which is
calibration but also sets where the board clips; and an R14 1 ohm / C30 0.1 uF
Zobel across the speaker.

NOT ESTABLISHED: IC1's part number. Its pinout is the shape of an LM377/LM378
family amplifier but the legend was not legible at 500 dpi, which is why C12's
corner is not computed. Also unread: whether Robotron and Sinistar carry the same
board revision, and where Sinistar's CVSD speech joins, which is not on this
sheet. phosphor-emulator-tesw."""

[[target]]
id = "btime-output"
machines = ["burgertime"]
status = "missing"
notes = """
EXAMINED. Off `unexamined` as `missing`, and the finding is structural rather
than a filter value.

THE BOARD DOES NOT SUM THE TWO CHIPS. Each AY-3-8910 brings its three analog
channels out on pins 4, 3 and 38. Five of the six tie to one bus. The sixth,
9F's channel A, CROSSES THAT BUS WITHOUT CONNECTING and goes off alone into a
two-pole multiple-feedback band-pass, then back into the mixer at higher level
and OPPOSITE POLARITY, its path being inverted twice where the bus path is
inverted once. The crossing was checked at pixel level: 9F channel A passes the
bus vertical with no dot, and 9F channel B one wire below meets it with a solid
one.

That is not expressible today, and not because of an omission in this board
file: `Ay8910::fill_audio` already sums a chip's three channels internally, so
the per-channel outputs the board needs do not exist at the device boundary.

THE FILTER IS A BAND-PASS, NOT A LOW-PASS. R51 1k, R50 10k to ground, C27 and
C28 0.068 uF, R49 4.7k feedback: f0 1.13 kHz, Q 1.14, gain at f0 -2.35. The same
parts read as a low-pass give a corner near 500 Hz, which is what a first pass
produced and it was wrong.

THE COUPLING CAPACITOR IS C21 100 uF, which this note used to say was not on a
schematic to hand. Into a nominal 8 ohm speaker that is 199 Hz, twenty times the
`DcBlocker`'s shared 10 Hz default. Also unmodelled: a VR1 10k volume pot, the
1181 power amplifier, and a ferrite bead with two capacitors at the speaker pin.

CONFIRMED RATHER THAN REFUTED: coupling AFTER the sum is right. C25 and C21 are
both between the chips and the speaker and neither is inside either chip, which
is what the old comment reasoned without a drawing. Its corner is wrong; its
position is not. Also, VR1 does NOT move a filter corner, which is worth
recording because the volume control does on four other boards in this sweep.

Transcribed at docs/schematics/btime-audio-output.md. Tracked as
phosphor-emulator-jenz. The scan is
archive.org/items/arcademanual_BurgerTime/BurgerTime.pdf, sheet 9-3 across PDF
pages 68-70, with the audio on page 69."""

[[target]]
id = "ccastles-output"
machines = ["ccastles"]
status = "missing"
notes = """
EXAMINED. Atari SP-241 sheet 8B, block `Audio Output`, and sheet 2A for the
amplifier board, transcribed at docs/schematics/ccastles-audio-output.md. The
row's own guess was right: there IS a summing amplifier after the POKEYs, and it
is now read.

TWO OF THE MODEL'S THREE CLAIMS ARE CONFIRMED, which is why this is the smallest
of the three Atari rows read in this pass.

- THE 1:1 SUM IS THE BOARD'S. R121 and R122 are both 100k into R123 62k, so
  `samples1 + samples2` weights the two chips exactly as the board does. Eighth
  confirmation in this sweep.
- THE COUPLING CAPACITOR IS REAL AND IN THE PLACE THE COMMENT SAYS. C31 and C37,
  0.22 uF, sit ONE PER CHIP ahead of the summing resistors rather than one behind
  the sum, but both work into 100k, so both corners are 7.23 Hz and by
  superposition one high-pass on `a + b` is the same filter as one on each. Only
  the corner is off: 7.23 Hz against the DcBlocker's 10 Hz default. Same shape as
  Mr. Do's finding.

WHAT IS MISSING is a voltage gain of about 4.55 per chip (220 ohm into a virtual
ground at the net AREF with 1k of feedback, package 5B on a +12 V single supply);
an antiphase output pair through R130 and R133 2.2k to J20; and the
Regulator/Audio II PCB 035435-01 rev F, two TDA2002A channels into two speakers
where this model is mono.

A NEGATIVE WORTH KEEPING: C30 and C35, 0.01 uF at each POKEY pin, are a low-pass
at AT LEAST 72.3 kHz, because R108 runs into a virtual ground. Missile Command's
same two parts in the same two places sit at least 159 Hz. Do not model this one.

NOT READ: which of pokey1 and pokey2 is 3D, which does not matter here because
the two chains are identical part for part. No measurement.

SCAN NOTE. The schematics are the last third of CCastles.pdf, not a separate
package: page 63 is the supplement cover, sheet 1A is page 64, each side advances
one page. Crystal-Castles-2board-schematic.pdf is a different two-page drawing of
the two-board revision and carries no audio. Both were checked."""

[[target]]
id = "docastle-output"
machines = ["docastle", "dorunrun", "dowild"]
status = "missing"
notes = """
EXAMINED, BUT ONLY MR. DO'S CASTLE. Off `unexamined` as `missing`. Universal
8302 sheet No. 4, which is printed rotated 90 degrees on its page. Do Run Run and
Mr. Do's Wild Ride are in this row and share the device file, and NEITHER board's
drawing was read; Galaga and Dig Dug turned out not to share their output stage
despite sharing a board family, so do not assume these three do.

THE ROW'S OWN QUESTION IS ANSWERED, and the answer confirms the model: the four
chips reach one node through four EQUAL 1.5k legs, so the balance is 1:1 and the
plain sum is right in ratio. Node source impedance 375 ohms plus the chips' own.

WHAT IS MISSING is everything after that node. A FIXED LOW SHELF worth about
22 dB: 22k in series, with 2k + 0.22 uF to ground beyond it, flat at DC, falling
from about 30 Hz, flat again above about 362 Hz at 2k/24k. In the band these
chips use that reads as roughly 10 dB more bass than treble, and it is the
largest single thing absent. Then a 1K B-taper pot wired as a RHEOSTAT from the
summing node to ground, the cabinet volume. Then 4.7 uF into an MB3730 whose pins
5 and 6 drive SP(+) and SP(-) through 4.7 ohm and 0.1 uF Boucherot cells: A
BRIDGE INTO ONE SPEAKER, where the model is mono. Same power amplifier part as
Galaga's Midway board.

THE VOLUME CONTROL DOES NOT MOVE THE SHELF, since it sits before the 22k that
dominates the shelf's series arm. Worth recording as the exception: on Pac-Man,
Lunar Lander, Galaga and Dig Dug the control setting does move a corner.

The `DcBlocker`'s position after the sum is right again; its corner cannot be
computed from this sheet, because 4.7 uF works against the MB3730's input
impedance and that is not on it.

Transcribed at docs/schematics/docastle-audio-output.md. Tracked as
phosphor-emulator-2926."""

[[target]]
id = "namco-galaga-output"
machines = ["digdug", "galaga", "xevious"]
status = "missing"
notes = """
EXAMINED, ON TWO DRAWINGS, AND IT IS THE PAC-MAN CIRCUIT. Off `unexamined` as
`missing`: the model forwards the WSG and stops, so none of the analog path is
present.

THE SAMPLE-TIMES-VOLUME MULTIPLY IS ANALOG here too, and the values are
identical to `namco-pac-output`. The 74LS273 at 1L holds two four-bit fields:
5Q-8Q drive R97 470, R98 1k, R99 2.2k and R100 4.7k into ONE node, and 1Q-4Q
gate four 4066 sections that tap that node through 10k, 22k, 47k and 100k.
Which field is which is settled by the data source: 5D-8D come from the
136007-X10 PROM addressed 32 samples by 8 waveforms, which is the model's
256-byte waveform ROM.

THE TWO GAMES DO NOT SHARE A VOLUME LAW, which is the finding a single reading
would have missed. The switched conductance is one arm of a divider and the
other arm differs: Dig Dug ties the node to +5V and ground through 10k each, so
the transfer is G/(G+200uS); Galaga runs it into R19 10k at an LM324's virtual
ground, so it is 1/(R_legs+10k). Normalised to full scale, both are louder than
a linear multiply at low volume codes, Dig Dug by up to 3.7 dB and Galaga by up
to 6.6 dB. One linear multiply cannot be right for both.

The sample ladder's deviation is not a level error but a KINK AT MID-SCALE: the
7-to-8 step is +0.82 LSB of DNL, and `wave_nibble - 8` puts the signed zero
crossing exactly there, so it is an odd-harmonic mechanism on every cycle.

Also unmodelled: a shunt capacitor at the node on each board whose corner MOVES
WITH THE VOLUME CODE, 3.3 to 6.0 kHz on Dig Dug and 8 to 20 kHz on Galaga; a
differential output pair on Dig Dug and an MB3730 bridge amplifier on Galaga,
where the model is mono; and the three voices reaching the node as a 96 kHz time
multiplex averaged by that capacitor, where the model sums them instantaneously.

NOTE FOR THE 54XX ROW: on Galaga the WSG and two 54XX filter outputs sum at one
LM324 inverting node, R19 10k against R21 33k and R36 33k. The junction belongs
to neither row alone.

Transcribed at docs/schematics/namco-galaga-audio-output.md, from the Galaga
Midway CPU PC sheet and the Dig Dug Atari SP-203 sheet 5A. Tracked as
phosphor-emulator-enst. Xevious is in this row and NO Xevious drawing was read;
its output stage is still unexamined.

Separate from `namco-54xx-explosion`, which is about the explosion circuit on the
same board: Galaga and Xevious were catalogued for that one path and nothing had
ever recorded this one, which is precisely the gap the per-machine check cannot
see. Dig Dug shares the board but has 51XX and 53XX rather than the 54XX, so it
appears here and not there."""

[[target]]
id = "namco-pac-output"
machines = ["pacman", "mspacman"]
status = "missing"
notes = """
EXAMINED AND FOUND SUBSTANTIAL. The first entry moved off `unexamined`, and it
came off as `missing` rather than `partial`: the board's whole analog path is
absent from the model, which forwards the WSG and stops.

THE SAMPLE-TIMES-VOLUME MULTIPLY IS ANALOG, done with two switched resistor
networks, and this is the same shape of finding as Lunar Lander's throttle. The
74LS273 at 2M holds two four-bit fields: 5Q-8Q drive R9 470, R8 1k, R7 2.2k and
R6 4.7k into one summing node, and 1Q-4Q gate four 4066 sections that tap that
node through R2 10k, R1 22k, R3 47k and R4 100k. Neither ladder is exactly
binary. Normalised to the largest leg, both run 1 : 0.47 : 0.21 : 0.10 where an
exact ladder gives 1 : 0.5 : 0.25 : 0.125, so a model computing `sample * volume`
in integer arithmetic is wrong by an amount that grows as either field gets
small, which is most of a decaying note.

Also unmodelled: C1 10 nF at the summing output, whose corner MOVES WITH THE
VOLUME CODE because the volume code decides which resistors are in circuit; the
22k-into-10k-pot volume network; and an LM1877 driving TWO speaker connectors,
where the emulator is mono. `SOUND ON` is the latch's CLR, so muting zeroes the
sample and the volume together rather than muting downstream.

Transcribed at docs/schematics/pacman-audio-output.md, from the troubleshooting
guide rather than the manual the board file used to cite. Tracked as
phosphor-emulator-ga9p. The first measurement wants no reference capture at all:
the ladder deviation is arithmetic against the transcribed table.

Superseded notes, kept because the mistake in them is instructive:

The Namco WSG straight to the speaker: `fill_audio` forwards the chip and
nothing else. The WSG's raw waveform output is a stepped 4-bit wave and the
board does not present it that way, so an output filter is the specific thing to
look for here.

EXAMINED, AND THE SCAN DOES NOT CONTAIN THE ANSWER. This is a negative result,
recorded so the next reader does not repeat the search.

The scan phosphor-emulator-aih3 cites for this board,
arcade-museum.com/manuals-videogames/P/pac-man_p2.pdf, holds the game logic
schematic across TWO pages, in reverse order: PDF p2 is the left half (manual
page 32, with the Z80 at 6B) and PDF p1 is the middle, continuing where p2 is
cut. PDF p1 is then itself CUT MID-COMPONENT at its right edge -- the 5L 74LS139,
the 4N 2114, the 4H 8T245 and the 5S 284 custom IC are all sliced through -- so a
third portion of the sheet is missing, and that is where the sound custom IC's
output and the amplifier are drawn.

All 35 pages were checked, not just the cited one. The rest is assembly drawings
(pp3-5), three small daughter boards (Z-80 sync bus controller, V-RAM addresser,
credit multiplier), cabinet wiring, and the Electrohome monitor's own schematics
and parts lists. No audio sheet anywhere.

What IS established, from the chip list on manual page 35: the game board carries
an LM377 dual audio amplifier. The assembly drawing at PDF p3 places it near R91,
a 10K "T" volume pot, with C48 4.7 uF, C49 47 uF tantalum, C50 0.0047 uF mylar
and C51 330 uF around it. A 4.7 nF mylar capacitor in an audio path is a filter
rather than decoupling. So there is certainly a stage here and the model has none
of it, but HOW those parts connect is not on any page of this scan.

One correction, since this row briefly said otherwise: R28, R29 and the 2N3391A
are NOT audio. Tracing them on PDF p2 puts them in the power-on reset circuit
with D1 and D6. They were read off an assembly drawing without tracing, which is
the mistake this file exists to make visible rather than to commit."""

[[target]]
id = "atari-vector-pokey-output"
machines = ["starwars", "esb"]
status = "missing"
notes = """
EXAMINED, AND IT IS THE LARGEST GAP THIS SWEEP HAS FOUND. Off `unexamined` as
`missing`. Atari SP-225 sheets 16A and 16B, the cleanest drawings in the phase.
Only Star Wars was read; The Empire Strikes Back is in this row, runs on the
same device file, and had no drawing read.

The row's own guess was right: the mixer has its own balance and speech does not
arrive at the same level by accident. It is worse than that.

THE FOUR POKEYS ARE NOT WEIGHTED EQUALLY. Into an inverting summer with R30 12k
feedback, CO0 and CO1 come through 47k (gain -0.2553) and CO2 and CO3 through
82k (-0.1463). Two chips are 4.84 dB louder than the other two, where the model
uses one `POKEY_GAIN` of 0.20 for all four. That 0.20 is the MEAN of the board's
four legs (0.2008), so the constant is right about the ensemble and wrong about
every individual chip.

SPEECH IS HOTTER ON THE BOARD. Its leg is 15k, gain -0.8, which against the
POKEY mean is 3.98 where the model's 0.50/0.20 is 2.5: about 4.05 dB.

EACH LEG HAS ITS OWN HIGH-PASS, one 0.1 uF per leg into the virtual ground:
33.9 Hz on the 47k legs, 19.4 Hz on the 82k legs, 106.1 Hz on speech. The model's
single 35 Hz block matches the 47k legs and is THREE TIMES TOO LOW FOR SPEECH.

THERE IS AN ANALOG DELAY LINE, an R5106 bucket-brigade clocked at 37.8 kHz by a
556, with an active filter either side of it. Unmodelled entirely.

STAR WARS IS STEREO BY CONSTRUCTION. Two TL084 sections give LEFT = -(D + A) and
RIGHT = -(D - A) at gains matched to 2.136, where D is the delayed signal and A
the dry: the dry lands entirely in the difference channel and the delayed
entirely in the sum. A difference matrix built out of one op-amp's two inputs.
The model is mono.

Each POKEY is loaded by a TRANSIMPEDANCE AMPLIFIER at a virtual ground, 1k with
1000 pF, which is a third distinct POKEY interface in this sweep after Missile
Command's 10k/0.1 uF and Tempest's 10k/0.015 uF.

Transcribed at docs/schematics/starwars-audio-output.md. Tracked as
phosphor-emulator-82zr. The schematics are PDF pages 114-147 of the
arcade-museum StarWars.pdf, with all the audio on 142 and 143."""

[[target]]
id = "foodf-output"
machines = ["foodf"]
status = "missing"
notes = """
EXAMINED. THE ROW'S OWN QUESTION IS ANSWERED: SP-229 does carry the audio sheet.
The same package whose sheets 7B, 8A and 8B were read for this board's VIDEO
under phosphor-emulator-aih3 carries sheet 10A, `Food Fight Sound`, which is the
whole of the game PCB's audio, and sheet 2B for the amplifier board. Nothing else
had to be fetched. Transcribed at docs/schematics/foodf-audio-output.md.

CONFIRMED: the three POKEYs are mixed 1:1:1. R70, R69 and R71 are all 330k into
one node with R68 22k to ground, so each chip reaches the node at exactly 1/18
before a non-inverting gain of 11, and `(s0 + s1 + s2) / 3.0` is the board's
ratio. Seventh confirmation in this sweep.

THE FINDING IS THE LOAD, AND IT IS A FOURTH DISTINCT ATARI POKEY INTERFACE. Each
pin 37 sits on 910 ohm to +5 V and 0.015 uF mylar to ground, a low-pass at AT
LEAST 11.66 kHz. Missile Command's is at least 159 Hz and Tempest's at least
1061 Hz on the same capacitor value. One chip, four laws, none modelled.

THE SUMMING STAGE IS TEMPEST'S, resistor for resistor, with a third leg: 330k
legs, 22k to ground, 10k and 100k around an LM324 for a gain of 11. First time in
this sweep a shared family HAS predicted a shared stage, and the part that
differs is the same part that differed between Missile Command and Tempest.

ALSO MISSING: the antiphase pair is asymmetric, because `AUDIO+` is DC-coupled
back to pin 37 while `AUDIO-` goes through C48 0.1 uF and R49 100k at 15.92 Hz,
and one DcBlocker at 10 Hz stands in for both; and the Regulator/Audio II PCB
035435-01 rev G, two TDA2002A channels into two speakers where this model is
mono. The model's DcBlocker does correspond to a real part, C6 or C15 on that
amplifier board, exactly as on Missile Command.

FIVE GAMES IN THIS CATALOG NOW END IN A REGULATOR/AUDIO II PCB: Missile Command,
Tempest, Quantum, Food Fight and Crystal Castles. The audio half is the same
circuit on all five and only the output coupling capacitor moves, 1000 uF on
Missile Command's rev B and 3300 uF on every later revision read. Worth modelling
once rather than five times.

NOT READ: which of pokey[0..2] is 11K/L. The sheet names the selects AUDIO 2,
AUDIO 1 and AUDIO 0 but they were not traced through the address decoder on sheet
5B. Nothing here depends on it, unlike Star Wars: all three legs and all three
loads are identical. No measurement."""

