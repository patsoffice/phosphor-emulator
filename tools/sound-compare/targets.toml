value. Neither is a large effect on most material; that is the honest framing.

ALSO UNMODELLED: Q2, a 2N4401, on the MC1408's current output with R26 3.3k and
C29 10 uF, so the DAC does not drive the amplifier directly; an EXTERNAL volume
control on connector J4 through R11 5.6k and R12 1k, where the model has no
volume at all; IC1's gain of about 100 from R17 220 against R16 2.2, which is
calibration but also sets where the board clips; and an R14 1 ohm / C30 0.1 uF
Zobel across the speaker.

NOT ESTABLISHED: IC1's part number. Its pinout is the shape of an LM377/LM378
family amplifier but the legend was not legible at 500 dpi, which is why C12's
corner is not computed. Also unread: whether Robotron and Sinistar carry the same
