# ---------------------------------------------------------------------------

[[target]]
id = "astdelux-discrete"
machines = ["astdelux"]
status = "missing"
notes = """
Explosion and latch paths mixed with the board's POKEYs. The register writes are
stubbed; the POKEYs work. Phase 8 item 1."""

[[target]]
id = "namco-54xx-explosion"
machines = ["galaga", "xevious"]
status = "missing"
notes = """
The MB8844's digital output plus the analog DAC, filter and mixer behind it.
Commands sent through the 06XX chip-select are discarded today and explosions
are silent. Phase 8 item 3; see also phosphor-emulator-uxi9."""

[[target]]
id = "konami-output-filters"
machines = ["scramble", "scobra", "frogger"]
status = "missing"
notes = """
The discrete output-filter controls. Filter selection is latched but nothing
models what it switches. Phase 8 item 4."""
