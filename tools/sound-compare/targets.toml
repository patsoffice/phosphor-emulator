[[target]]
id = "congo-percussion"
machines = ["congobongo"]
device = "machines/src/congo_sound.rs"
status = "blocked"
reason = """
There is no reference capture to compare against, and there cannot be one from
an emulator: the reference plays recorded WAVs because it never modelled this
circuit. Comparing against those measures whoever made the recordings. The
reference here is the drawing, so the next step is a rebuild and not a
comparison, and `implemented-needs-validation` is unreachable until one exists.
Tracked as phosphor-emulator-7z54."""
notes = """
THE PHASE'S ORDERING RATIONALE FOR THIS TARGET WAS FALSE, and this row is where
that is recorded. It was listed first on the grounds that its reference is a
different kind, sample playback, which would exercise the claim that the tooling
does not care where a WAV came from.

The board does not play samples. Sound Board 834-5168 sheet 2 has all five voices
as analog circuits: four identical drum channels, each a 7416 open-collector
inverter into a diode-and-RC envelope shaper into a ringing multiple-feedback
band-pass on a 3614, plus a separate gorilla built from two 4538B monostables and
an HM5837 noise IC. Transcribed at docs/schematics/congo-percussion.md, including
the four mixing resistors that set the balance.

The emulator's implementation choice was read as evidence about the hardware.
Reading the drawing took twenty minutes; the belief had been in the plan for
weeks."""

