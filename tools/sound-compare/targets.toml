[[target]]
id = "irobot-output"
machines = ["irobot"]
device = "machines/src/irobot.rs"
status = "partial"
notes = """
EXAMINED. CPU PCB SP-251 sheet 4A, transcribed at
docs/schematics/irobot-audio-output.md.

THE FIRST ENTRY IN THIS SWEEP WHERE A CONSTANT WE ALREADY HAD IS RIGHT. The four
POKEY outputs on the 4E quad-POKEY, pins 28, 29, 27 and 21, are tied DIRECTLY
together with no summing resistors. Four equal-impedance outputs shorted together
average, so `mix_audio`'s `* 0.25` is what the board does. The comment beside it
credits the reference emulator's routing, which is true but is not the reason it
is correct; recorded because "borrowed and happens to be right" and "derived from
the board" read identically in code and are different claims.

WHAT IS NOT MODELLED is everything after that node: C9 0.22 uF shunting the
paralleled output to ground; a gain stage of about -4.5 (R20 1k against R19 220)
on an LM324; C8 0.22 uF coupling into a unity inverter; and then a second unity
inverter, so that AUD1 and AUD2 leave on connector pins 8 and 9 as A DIFFERENTIAL
PAIR where irobot.rs is mono. The LM324 runs single-supply on +10.3 V with an
AUD5V mid-rail bias from R276 100k and C31 0.47 uF, so its clipping is asymmetric
about that bias rather than about zero.

Neither capacitor's corner is established: both depend on impedances not on this
sheet. phosphor-emulator-2u1j."""

[[target]]
id = "missile-output"
machines = ["missile"]
status = "missing"
notes = """
EXAMINED. Off `unexamined` as `missing`: the model applies a shared `DcBlocker`
and a scale, and the board's whole analog path is absent.

POKEY pin 37 sits on R38 10k to +5V and C70 0.1 uF to ground, a low-pass. Then
N10 LM324 section a as a unity follower (pin 6 tied to pin 7; C75 is across the
+12/-5 supplies, not in the feedback), then two inverting sections at -1 each,
producing AUD 1 on J20 pin E and AUD 2 on J20 pin S. THE GAME PCB EMITS AN
ANTIPHASE PAIR and the model is mono. Nothing on the game PCB is AC-coupled: the
op-amps run split supplies with their + inputs at ground.

The pair drives the Regulator/Audio II PCB 035435-02, which Tempest also uses,
where each channel is a 1k-against-11k divider (-20.8 dB), a C6 0.22 uF coupling,
a TDA2002A at 1 + 220/10 = 23, a Boucherot cell, and a 1000 uF output coupling
into its own speaker: 19.9 Hz for a nominal 8 ohms. TWO SPEAKERS.

The `DcBlocker` here does correspond to a real part, C6 and C15, but they are on
the Regulator/Audio II board; the comment in `missile_command.rs` reads as though
the capacitor were on the game PCB, and it is not.

Transcribed with Tempest at docs/schematics/atari-pokey-audio-output.md. Tracked
as phosphor-emulator-hd8n. The schematics are a Drawing Package Supplement
appended to MissileCommand.pdf at PDF pages 59-63, after three manuals."""

[[target]]
id = "mrdo-output"
machines = ["mrdo"]
status = "missing"
notes = """
EXAMINED. Off `unexamined` as `missing`. Universal 8201 sheet 1 (printed rotated
90 degrees) and the separate `SOUND AMPLIFIER DIAGRAM AND PARTS LOCATION`.

CONFIRMED: the two SN76489s reach an inverting summing amplifier through equal
R8/R9 100k legs with R10 100k feedback, so the balance is 1:1 and the plain sum
is the board's law.

A COMMENT CORRECTION RATHER THAN A CODE ONE. `mrdo.rs` applies one `DcBlocker`
to the sum and says the capacitor sits between the chips and the amplifier. On
the board the coupling is C5 and C6, ONE PER CHIP, AHEAD of the summing
resistors. By superposition that is the same filter, so the output is right and
only the stated reason is wrong.

THE DOMINANT HIGH-PASS IS NOT NEAR THE CHIPS. It is C1 470 uF in one speaker leg,
42.3 Hz into a nominal 8 ohm speaker. The per-chip coupling is 1.59 Hz.

Also missing: R101 1k out of the main board, then on the Sound Amplifier Unit an
R3 10k / R4 51k / VR1 1k attenuator that throws away about 34 dB before the
amplifier, C4 4.7 uF coupling, and an MB3730 driving S1 and S2 AS A BRIDGE with
a 4.7 ohm and 0.1 uF Boucherot cell on each output. The model is mono.

MR. DO AND MR. DO'S CASTLE DO NOT SHARE AN OUTPUT STAGE, despite one
manufacturer, one year apart and the same MB3730 part. Castle mixes passively
into a 22 dB shelf on the main board; Mr. Do mixes in an op-amp and puts the
amplifier on a separate unit behind a 51k attenuator. Third time in this sweep
that a shared family has not meant a shared output stage.

Transcribed at docs/schematics/mrdo-audio-output.md. Tracked as
phosphor-emulator-4056."""

[[target]]
id = "gottlieb-output"
machines = ["qbert"]
device = "machines/src/gottlieb.rs"
status = "partial"
notes = """
EXAMINED. Sound/Speech Assy. A6 schematic, transcribed at
docs/schematics/qbert-sound-output.md. `partial` because two of the three things
that looked like gaps turned out to be modelled already, and the third is real.

ALREADY MODELLED, and worth recording so nobody re-finds it: both MC1408s are
accounted for. U19 and U20 are each an 8-bit DAC off a pair of 74LS75 latches
with its own strobe; one is the audio DAC and the other steers the SC-01's clock,
and gottlieb.rs has `Mc1408Dac` for the first and a clock-rate function for the
second. The post-sum coupling capacitor is modelled too, with a comment that
already reasons correctly about why it belongs after the sum.

THE GAP IS THE MIX. The two sources do not arrive at the amplifier as a plain
sum: each has its own 10k trimmer (R15, R16) with its own 0.047 uF coupling
capacitor (C31, C32), and the two wipers meet at a node feeding R18 100k into a
U23 LM379S on +30 V. So the DAC-to-speech balance is TWO PARTS, where the model
has the literal 32000.0 it scales the Votrax by, and each leg is AC-coupled
BEFORE the sum where the model couples once after it. Those are not the same
filter. The cabinet adds a 100 ohm 2 W volume control into a 4 ohm 5 W speaker.

Not traced: which source drives which trimmer, and what the two LM741 inverters
around the voice-clock oscillator do to the levels. The model's linear
"plus or minus 5.5 kHz per DAC step" is a straight-line fit to a transistor
oscillator whose parts are on this sheet and were not worked out.
phosphor-emulator-i8y7."""

[[target]]
id = "quantum-output"
machines = ["quantum"]
status = "missing"
notes = """
EXAMINED. Atari SP-221 sheet 9A, block `Audio Output`, and sheet 2A for the
amplifier board, transcribed at docs/schematics/quantum-audio-output.md.

THE TWO POKEYS DO NOT REACH THE MIXER THROUGH THE SAME CIRCUIT, so the model's
`(s0 + s1) * 0.5` is wrong in balance, in polarity and in spectrum at once, and
no single constant can express it.

Both chips land on a transimpedance amplifier, pin 37 into an LM324's inverting
input with 1k of feedback and the net AREF on the non-inverting input. Then 2/3B
goes C79 0.1 uF into R206 220k straight to the mixer, while 2/3D goes through an
EXTRA INVERTING STAGE whose feedback is R212 220k in parallel with C80 0.022 uF.
That is a low-pass at 32.88 Hz with a passband gain of -1, so 2/3D arrives
INVERTED and -10.1 dB at 100 Hz, -22.5 dB at 440 Hz and -29.7 dB at 1 kHz. The
mixer legs themselves ARE equal, R206 and R213 both 220k into R207 220k, so the
asymmetry is entirely in that extra stage.

WHICH OF pokey[0] AND pokey[1] IS 2/3D IS NOT ESTABLISHED and it blocks the rest,
because it decides which chip loses its top four octaves. Same question BurgerTime
and Star Wars left open, and unlike Food Fight and Crystal Castles it cannot be
shrugged off here.

ALSO MISSING: every coupling on the board is 0.1 uF into 220k, so every high-pass
is 7.23 Hz where the model has one DcBlocker at 10 Hz; a symmetric antiphase pair
on connector pins 13 and 12; and the Regulator/Audio II PCB 035435-02 rev F, two
TDA2002A channels into two speakers where this model is mono.

A DRAWING INCONSISTENCY, RECORDED AND NOT RESOLVED. AREF computes to +5 V from
R204 220k alone, while package 3C is drawn with +5 V on pin 4, which an LM324
cannot reconcile. Crystal Castles uses the same AREF scheme on +12 V, where it is
unremarkable, so Quantum's pin 4 label is the likelier error. It changes none of
the AC results. No measurement."""

[[target]]
id = "mcr2-output"
machines = ["shollow"]
device = "core/src/device/ssio.rs"
status = "partial"
notes = """
EXAMINED. Super Sound I/O schematic A084-90913-E000, transcribed at
docs/schematics/ssio-audio-output.md. `partial` because the duty-cycle
attenuation IS modelled, as its average; nothing else on the analog half is.

THE DUTY-CYCLE VOLUME IS AN ANALOG CHOPPER. A 74LS191 loaded with four bits
drives a 7407 that gates two 4066 sections in series with the channel's audio,
with 5.6k resistors and 2.2 nF capacitors either side. `DUTY_CYCLE_VOLUME` in
ssio.rs is a sixteen-entry lookup of that chopper's mean, which has neither the
smoothing nor the residue of the chopping.

THE MIX IS NOT AN AVERAGE. Six channels, three per AY, each through an MC3403
with 33k legs, then 1 uF coupling and 13k into a summing MC3403 with 27k feedback
and a 330 pF pole. ssio.rs computes `(s0 + s1) / 2` over the two chips.

THE BOARD IS STEREO. Connector J3 carries L AUDIO and R AUDIO from two LM3900
sections, each through 10k with 1.2k to ground; ssio.rs is mono. Volume is a
remote analog control on RV12/RVR/RVS with an optional 1k pot, not the boolean
`mute` the model has.

Read from TRON's manual, PDF p128, not Satan's Hollow's: the board is shared
across MCR II and no Satan's Hollow scan was located. Note that
phosphor-emulator-aih3 cites this as "sheet 9-10", which is Satan's Hollow's
numbering; in Tron's package the same drawing is 9-15. Sheet numbers are per
manual and are not a stable way to name one. phosphor-emulator-cg2f."""

