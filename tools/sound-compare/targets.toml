  "asteroids/thump",
  "asteroids/thrust",
  "asteroids/explosion",
  "asteroids/life",
  "asteroids/saucer",
  "asteroids/saucer-large",
  "asteroids/saucer-fire",
  "asteroids/ship-fire",
]
notes = """
Rebuilt from the schematic voice by voice. Thrust is the open question: see
phosphor-emulator-asteroids-sound-postprocessing-hm4t. Its fire voices match
above 150 Hz on every metric, with a low-frequency pedestal the board has and
