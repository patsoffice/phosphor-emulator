[[target]]
id = "galaxian-family-variants"
machines = ["pisces", "uniwars"]
device = "core/src/device/galaxian_sound.rs"
adapter = "galaxian-discrete"
status = "implemented-needs-validation"
scenarios = [
  "galaxian/background",
  "galaxian/fire",
  "galaxian/hit",
  "galaxian/melody",
]
notes = """
PHASE 7 ITEM 6, AND THE ANSWER IS THAT THESE TWO NEED NO SCENARIOS OF THEIR OWN.
That was the thing to establish, and inventing four near-duplicate rows to fill
the column would have been the wrong outcome.

Pisces and UniWar S wrap the same GalaxianBoard, which owns the same
GalaxianSound, and the reference builds them by calling galaxian() and changing
only the memory map. The analog board is identical, so a scenario here would
drive the same device through the same controls to the same samples as
galaxian/*. They are listed against Galaxian's four scenarios rather than given
copies.

What would justify a variant scenario is a variant that drives the device into a
region Galaxian's scenarios never reach -- a pitch outside the tested range, say.
That is a question about the game program rather than the board, and it has not
been traced for either. Recorded as unexamined, not as absent.

The other three machines this row used to name have moved. Moon Cresta has a
different mixer and is now its own entry; Scramble and Scobra are not on this
board at all."""

[[target]]
id = "mooncrst-mixer"
machines = ["mooncrst"]
device = "core/src/device/galaxian_sound.rs"
adapter = "galaxian-discrete"
status = "partial"
scenarios = [
  "galaxian/background",
  "galaxian/fire",
  "galaxian/hit",
  "galaxian/melody",
]
notes = """
MOON CRESTA IS NOT GALAXIAN'S SOUND BOARD, and this is the difference Phase 7
item 6 existed to find. Everything up to the mixer is shared; the mixer is not.

Galaxian sums in two stages, a five-way pre-mix into a three-way final mix, with
the background and melody group entering through R34 5.1k and a 10k load at the
output. Moon Cresta sums all seven legs in ONE stage, puts that group through
R34 15k, and has no load resistor. So its background and melody sit about 9 dB
down against its hit and fire, and its overall level is higher.

Read off the drawing, not inferred: Gremlin `MOON CRESTA SCHEMATIC ELECTRONICS
MODIFIED` 97332-P, Main I.C. Board sheet 3, in
arcade-museum.com/manuals-videogames/M/moon-cresta-manual.pdf at PDF p23, where
R34 is labelled 15K and all seven legs meet one node into R42 22k and C39. The
reference netlist agrees, importing Galaxian's and replacing only the mixing
stage.

`core/src/device/galaxian_sound.rs` hard-codes 5.1k and the two-stage
arrangement, so Moon Cresta currently plays Galaxian's mix. `partial` for that
reason: the voices are right and the balance is not. The four scenarios listed
are Galaxian's, which drive the identical voice hardware and would show the
mixer difference the moment the device models it. phosphor-emulator-3m0n."""

