[[target]]
id = "mcr2-output"
machines = ["shollow"]
device = "core/src/device/ssio.rs"
status = "partial"
notes = """
EXAMINED. Super Sound I/O schematic A084-90913-E000, transcribed at
docs/schematics/ssio-audio-output.md. `partial` because the duty-cycle
attenuation IS modelled, as its average; nothing else on the analog half is.

THE DUTY-CYCLE VOLUME IS AN ANALOG CHOPPER. A 74LS191 loaded with four bits
drives a 7407 that gates two 4066 sections in series with the channel's audio,
with 5.6k resistors and 2.2 nF capacitors either side. `DUTY_CYCLE_VOLUME` in
ssio.rs is a sixteen-entry lookup of that chopper's mean, which has neither the
smoothing nor the residue of the chopping.

THE MIX IS NOT AN AVERAGE. Six channels, three per AY, each through an MC3403
with 33k legs, then 1 uF coupling and 13k into a summing MC3403 with 27k feedback
and a 330 pF pole. ssio.rs computes `(s0 + s1) / 2` over the two chips.

THE BOARD IS STEREO. Connector J3 carries L AUDIO and R AUDIO from two LM3900
sections, each through 10k with 1.2k to ground; ssio.rs is mono. Volume is a
remote analog control on RV12/RVR/RVS with an optional 1k pot, not the boolean
`mute` the model has.

Read from TRON's manual, PDF p128, not Satan's Hollow's: the board is shared
across MCR II and no Satan's Hollow scan was located. Note that
phosphor-emulator-aih3 cites this as "sheet 9-10", which is Satan's Hollow's
numbering; in Tron's package the same drawing is 9-15. Sheet numbers are per
manual and are not a stable way to name one. phosphor-emulator-cg2f."""

[[target]]
id = "tempest-output"
machines = ["tempest"]
status = "missing"
notes = """
EXAMINED. Off `unexamined` as `missing`: `(pokey1 + pokey2) * 0.5` and nothing
else, no filter and no DC removal.

Both POKEYs are on the auxiliary PCB, at B/C2 and C/D2. Each pin 37 sits on 10k
to +5V and 0.015 uF mylar to ground. MISSILE COMMAND'S SAME NETWORK USES 0.1 uF,
6.7 times larger, so the two games' POKEY outputs are filtered very differently
at source and both are modelled as no filter. Same family, two laws, which is the
second time this sweep has found that.

The two are summed passively through equal R32/R33 330k into R34 22k, then K6
LM324 section a amplifies by 1 + 100k/10k = 11, giving AUD+; section b inverts it
through C27 0.1 uF and R35 100k, giving AUD-. Antiphase pair, two speakers, and
the model is mono. THE MODEL HAS NO DC REMOVAL where the board has C27 and the
0.22 uF at each amplifier input.

CONFIRMED RATHER THAN REFUTED: the equal 330k legs mean the two POKEYs are
weighted 1:1, which is what `* 0.5` encodes. The board's factor is 0.647 per
POKEY, not 0.5, but nothing in the model calibrates an absolute level.

Shares the Regulator/Audio II PCB 035435-02 with Missile Command, here at
revision E, whose only audio difference found is the output coupling: 3300 uF
against Missile's 1000 uF, so 6.0 Hz against 19.9 Hz into a nominal 8 ohms.

Transcribed with Missile Command at docs/schematics/atari-pokey-audio-output.md.
Tracked as phosphor-emulator-hd8n. NOTE FOR THE NEXT READER: the arcade-museum
Tempest.pdf is the operation manual and has NO schematics; all 60 pages were
checked. The schematics are a separate Drawing Package Supplement."""
