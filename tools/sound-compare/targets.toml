[[target]]
id = "docastle-output"
machines = ["docastle", "dorunrun", "dowild"]
status = "missing"
notes = """
EXAMINED, ALL THREE MACHINES. Off `unexamined` as `missing`. Universal 8302
sheet No. 4, which is printed rotated 90 degrees on its page, plus the
`Fig. 4 Sound Amplifier Diagram` from each of the two conversion kits' service
manuals.

AND THE SPLIT IS TWO AGAINST ONE, BY KIT RATHER THAN BY GAME. Do Run Run and
Mr. Do's Wild Ride are each other's twin, component for component, down to the
volume control's ordering code. Mr. Do's Castle is the odd one out.

Both kits carry the same MB3730 as the 8302 and the same small-signal values
around it, 4.7 uF in, 22 uF of gain, 4.7 ohm and 0.1 uF Boucherot cells, and the
identical 1k B-taper volume part. But their volume is a three-terminal DIVIDER
fed through 51k with 10k to ground, where the 8302's is a rheostat, and one of
their speaker terminals reaches the speaker through a 470 uF where the 8302 has
no coupling capacitor at all. The chip is shared, the level and the
low-frequency corner are not. Written up in the conversion-kit section of
docs/schematics/docastle-audio-output.md.

Galaga and Dig Dug turned out not to share their output stage despite sharing a
board family, and this row has now gone the same way. Note which guess would
have failed here: "same manufacturer, same year, same amplifier IC" predicts one
grouping and the drawings give another.

THE ROW'S OWN QUESTION IS ANSWERED, and the answer confirms the model: the four
chips reach one node through four EQUAL 1.5k legs, so the balance is 1:1 and the
plain sum is right in ratio. Node source impedance 375 ohms plus the chips' own.

WHAT IS MISSING is everything after that node. A FIXED LOW SHELF worth about
22 dB: 22k in series, with 2k + 0.22 uF to ground beyond it, flat at DC, falling
from about 30 Hz, flat again above about 362 Hz at 2k/24k. In the band these
chips use that reads as roughly 10 dB more bass than treble, and it is the
largest single thing absent. Then a 1K B-taper pot wired as a RHEOSTAT from the
summing node to ground, the cabinet volume. Then 4.7 uF into an MB3730 whose pins
5 and 6 drive SP(+) and SP(-) through 4.7 ohm and 0.1 uF Boucherot cells: A
BRIDGE INTO ONE SPEAKER, where the model is mono. Same power amplifier part as
Galaga's Midway board.

THE VOLUME CONTROL DOES NOT MOVE THE SHELF, since it sits before the 22k that
dominates the shelf's series arm. Worth recording as the exception: on Pac-Man,
Lunar Lander, Galaga and Dig Dug the control setting does move a corner.

The `DcBlocker`'s position after the sum is right again; its corner cannot be
computed from this sheet, because 4.7 uF works against the MB3730's input
impedance and that is not on it.

Transcribed at docs/schematics/docastle-audio-output.md. Tracked as
phosphor-emulator-2926."""

[[target]]
id = "namco-galaga-output"
machines = ["digdug", "galaga", "xevious"]
status = "partial"
notes = """
MODELED 2026-09-17 in machines/src/namco_wsg_output.rs, the stage Pac-Man got
first, now shared: both ladders, the node's shunt and the coupling, with each
board's bias arm as a constant. All three machines here are wired to it and each
carries its own parameters.

EXAMINED, ON THREE DRAWINGS, AND IT IS THE PAC-MAN CIRCUIT.

STILL `partial`: no adapter, no scenario, and every board here still leaves the
PCB differentially where the model is mono. Galaga has now been compared against
a reference capture, below; Dig Dug and Xevious have not.

COMPARED ON GALAGA 2026-09-18, the first reference capture this row has ever
had. Coin and 1 player start driven into both emulators from reset with nothing
firing, so the 54XX stays out of the window.

OUR WSG DOES SIT ABOVE THE REFERENCE'S, BUT NOT BY 5.7 dB AND NOT BY AN ERROR.
That figure came from the peaks of two whole captures, which is the one thing
these two runs cannot share: a game driven from reset diverges within a second
or two, and by 32 s ours was silent while the reference was still playing.
Driving both output models with the SAME voice stream instead removes the
content entirely:

| volume code | ours | reference | gap |
|---|---|---|---|
| 15 | -3.75 dBFS | -5.56 | 1.80 dB |
| 10 | -5.22 | -9.08 | 3.86 |
| 4 | -10.67 | -17.04 | 6.37 |
| 1 | -21.71 | -29.08 | 7.37 |

Two terms, and neither is a defect:

- 1.8 dB IS THE TWO EMULATORS' FULL-SCALE CONVENTIONS and nothing else. Ours is
  `LEGACY_FULL_SCALE`, which pins this board's loudness to the integer path the
  stage replaced. The reference's is a mix resolution of 128 * 3 voices behind a
  route of 0.90 * 10/16. Both are house numbers, so an absolute dBFS comparison
  of this path decides nothing on its own; the scale-invariant band energies are
  what to read.
- THE REST IS THE VOLUME LAW, which is the reason this stage exists. The
  reference multiplies sample by volume linearly where the board divides against
  its bias arm, so the gap is a function of the code rather than a constant:
  2.19 dB at code 10 and 6.59 dB at code 1 from the divider alone. The table's
  residual above the 1.8 dB is a little under each of those, 2.06 and 5.57,
  because the shunt's corner falls with the code too and takes the edges off a
  square at the bottom of the range.

WHICH CODE GALAGA ACTUALLY USES SETTLES IT: volume code 10 and almost nothing
else, 2900 of 2942 non-silent voice-frames over the committed movie, the
remaining 42 stepping down through 8, 6, 4 and 2 on one effect. So the
compression this row records is not a detail of decay tails. It is in the signal
the whole time, it is worth 2.19 dB there, and it is what a linear multiply
cannot produce. Measured against the drawing rather than against the reference,
ours is the one that is right.

THE MULTIPLEX IS NOW MODELED, 2026-09-18, and it was not the level after all.
`full_swing`'s three voices was the right normalization and the wrong topology.
The board has ONE latch, ONE DAC and ONE switched network with the bias arm
permanently connected, so the node settles by charge balance over a frame rather
than by superposition, and a sum of three independent dividers only equals that
when all three voices carry the same conductance. Galaga's music is three voices
at code 10, which is exactly that case, which is why the level comparison above
could not see it. A voice playing ALONE was up to 7.2 dB quiet on Pac-Man.

The twelve switched legs now meet at one node against one bias arm, each scaled
by its voice's duty cycle. THE DUTY CYCLES ARE READ, not assumed: the sequencer
PROM is byte-identical in all eleven ROM sets of this family (`prom-2.5c` on the
four Galaga revisions, `xvi-1.5n`, `136007.109`, `82s126.3m`, `bos1-2.5c`, SHA-1
`0c4d0bee858b97632411c440bea6948a74759746`), and its four outputs partition a
64-dot frame into thirteen slots and three. The three voice slots are 5, 10 and
15, so the holds are 5, 5 and 6 of sixteen: NOT even thirds, a 1.58 dB spread.
Full working at `SLOT_DUTY` in the source and in phosphor-emulator-mn5w.

The corner came with it, because it falls out of the same node: the model used to
run about twice high, which is out of band on Galaga and squarely in it on
Pac-Man. Every machine in the family got darker, Ms. Pac-Man's centroid by 272 Hz.
`RECONSTRUCTION_HEADROOM` went 0.8 to 0.6 to clear the rail. JUDGED BY EAR AND
SIGNED OFF before landing, which is this epic's step 4.

WHAT THE CAPTURE DID SHOW is the explosion balance, in the other direction: over
the attract demo the reference peaks 8.7 dB ABOVE ours. That is the
`namco-54xx-explosion` row's settled finding and not this one's.

Measured over the committed movies, against the integer multiply it replaced:
peak -4.41 to -4.07 dBFS on Galaga, -0.91 to -1.04 on Dig Dug, -1.21 to -0.07 on
Xevious, so the level did not move and the timbre did.

THE SAMPLE-TIMES-VOLUME MULTIPLY IS ANALOG here too, and the values are
identical to `namco-pac-output`. The 74LS273 at 1L holds two four-bit fields:
5Q-8Q drive R97 470, R98 1k, R99 2.2k and R100 4.7k into ONE node, and 1Q-4Q
gate four 4066 sections that tap that node through 10k, 22k, 47k and 100k.
Which field is which is settled by the data source: 5D-8D come from the
136007-X10 PROM addressed 32 samples by 8 waveforms, which is the model's
256-byte waveform ROM.

THE TWO GAMES DO NOT SHARE A VOLUME LAW, which is the finding a single reading
would have missed. The switched conductance is one arm of a divider and the
other arm differs: Dig Dug ties the node to +5V and ground through 10k each, so
the transfer is G/(G+200uS); Galaga runs it into R19 10k at an LM324's virtual
ground, so it is 1/(R_legs+10k). Normalised to full scale, both are louder than
a linear multiply at low volume codes, Dig Dug by up to 3.7 dB and Galaga by up
to 6.6 dB. One linear multiply cannot be right for both.

The sample ladder's deviation is not a level error but a KINK AT MID-SCALE: the
7-to-8 step is +0.82 LSB of DNL, and `wave_nibble - 8` puts the signed zero
crossing exactly there. This row first called that an odd-harmonic mechanism and
`namco-pac-output` called the same ladder an even-harmonic one; measured against
Galaga's eight PROM waveforms, neither is right. The deviation is exactly
odd-symmetric about code 7.5 and the signed zero is code 8, and that half-code
offset mixes the two. It lands 23 to 30 dB below each waveform's own AC content.

Also unmodelled: a shunt capacitor at the node on each board whose corner MOVES
WITH THE VOLUME CODE, 3.3 to 6.0 kHz on Dig Dug and 8 to 20 kHz on Galaga; a
differential output pair on Dig Dug and an MB3730 bridge amplifier on Galaga,
where the model is mono; and the three voices reaching the node as a 96 kHz time
multiplex averaged by that capacitor. THAT ONE IS NOW MODELED; see the entry
above. It cost both the corner and the balance between voices, and the reading
that settled its duty cycles is the sequencer PROM rather than any drawing.

NOTE FOR THE 54XX ROW: on Galaga the WSG and two 54XX filter outputs sum at one
LM324 inverting node, R19 10k against R21 33k and R36 33k. The junction belongs
to neither row alone.

XEVIOUS WAS READ 2026-09-17, from Atari SP-230 sheets 5A and 5B, and it is
GALAGA'S stage rather than Dig Dug's: R119 10k into an LM324 virtual ground with
R125 3.3k feedback, two 33k filter legs on the same node, C7 0.0022 uF at the
DAC. Read before it was modeled, which matters on a row where the two boards
already examined did not agree with each other.

Transcribed at docs/schematics/namco-galaga-audio-output.md, from the Galaga
Midway CPU PC sheet, the Dig Dug Atari SP-203 sheet 5A and the Xevious SP-230.
Tracked as phosphor-emulator-enst.

Separate from `namco-54xx-explosion`, which is about the explosion circuit on the
same board: Galaga and Xevious were catalogued for that one path and nothing had
ever recorded this one, which is precisely the gap the per-machine check cannot
see. Dig Dug shares the board but has 51XX and 53XX rather than the 54XX, so it
appears here and not there."""

[[target]]
id = "namco-pac-output"
machines = ["pacman", "mspacman"]
status = "partial"
notes = """
MODELED 2026-09-17 in machines/src/namco_pac_sound.rs, on the DiscreteCircuit
runtime: both resistor ladders, C1, and the C46 coupling. The WSG's voices reach
it as the two latch fields through `NamcoWsg::tick_voices`, because the product
`sample * volume` is the one quantity this board never forms.

THE MULTIPLEX WAS MODELED 2026-09-18 and this is the board it mattered most on.
The shared stage used to give each voice its own divider and sum the three, where
the board has one latch, one DAC and one switched network against a permanently
connected bias arm. Pac-Man has the smallest bias arm in the family, 32.3 uS, so
it had the largest error: A VOICE PLAYING ALONE CAME OUT 7.2 dB QUIET, and the
shunt's corner ran at 8.95 kHz where the drawing gives 3.33 kHz at full volume,
which on this board is squarely in the audible band rather than above it. Both are
one topology change, described in the `namco-galaga-output` row and at `SLOT_DUTY`
in machines/src/namco_wsg_output.rs, with duty cycles read off the sequencer PROM
(`82s126.3m` here, the same part as the rest of the family).

Ms. Pac-Man's spectral centroid fell 272 Hz and Pac-Man's 27 Hz over the committed
movies; the difference between them is the two games' own content. Judged by ear
and signed off before landing.

STILL `partial`, not `implemented-needs-validation`: nothing has been compared
against a reference capture, there is no adapter and no scenario, R5 is still
untraced, and the LM1877's two speaker connectors are still one mono output.
What the model is checked against is the drawing's own arithmetic, in the unit
tests beside it.

Measured over the committed movie, against the integer multiply it replaced: DC
offset -0.0202 to +0.0001, peak -4.67 to -1.73 dBFS, AC RMS 0.8 dB louder, decay
T20 0.125 s to 0.239 s, and band energy moving 10.8 pp out of 0-150 Hz and
13.4 pp into 400-1000 Hz. The decay and the low end are the volume law and the
coupling; the top two bands falling is C1.

WHAT WAS FOUND, and why it was worth modeling.

THE SAMPLE-TIMES-VOLUME MULTIPLY IS ANALOG, done with two switched resistor
networks, and this is the same shape of finding as Lunar Lander's throttle. The
74LS273 at 2M holds two four-bit fields: 5Q-8Q drive R9 470, R8 1k, R7 2.2k and
R6 4.7k into one summing node, and 1Q-4Q gate four 4066 sections that tap that
node through R2 10k, R1 22k, R3 47k and R4 100k. Neither ladder is exactly
binary. Normalised to the largest leg, both run 1 : 0.47 : 0.21 : 0.10 where an
exact ladder gives 1 : 0.5 : 0.25 : 0.125, so a model computing `sample * volume`
in integer arithmetic is wrong by an amount that grows as either field gets
small, which is most of a decaying note.

The volume network turned out to be the large mechanism, and the arithmetic for
it is in the transcription. It is a divider into the 31k the 4066 sections
drive, not a sum of leg gains, so code 1 sits 11.1 dB below full scale where
`code / 15` puts it at 23.5 dB: every decaying note in the game was decaying
about twice as far in dB as the board's does.

Two more the model now carries: C1 10 nF at the summing output, whose corner
MOVES WITH THE VOLUME CODE because the volume code decides which resistors are
in circuit, and the sample ladder's asymmetry, whose zero sits at 0.5607 of full
scale rather than 0.5 and which therefore adds even harmonics.

Still absent: the LM1877 driving TWO speaker connectors, where the emulator is
mono, and R5. `SOUND ON` is the latch's CLR, so muting zeroes the sample and the
volume together rather than muting downstream, which is what
`tick_voices` reports when sound is off.

Transcribed at docs/schematics/pacman-audio-output.md, from the troubleshooting
guide rather than the manual the board file used to cite. Tracked as
phosphor-emulator-ga9p.

Superseded notes, kept because the mistake in them is instructive:

The Namco WSG straight to the speaker: `fill_audio` forwards the chip and
nothing else. The WSG's raw waveform output is a stepped 4-bit wave and the
board does not present it that way, so an output filter is the specific thing to
look for here.

EXAMINED, AND THE SCAN DOES NOT CONTAIN THE ANSWER. This is a negative result,
recorded so the next reader does not repeat the search.

The scan phosphor-emulator-aih3 cites for this board,
arcade-museum.com/manuals-videogames/P/pac-man_p2.pdf, holds the game logic
schematic across TWO pages, in reverse order: PDF p2 is the left half (manual
page 32, with the Z80 at 6B) and PDF p1 is the middle, continuing where p2 is
cut. PDF p1 is then itself CUT MID-COMPONENT at its right edge -- the 5L 74LS139,
the 4N 2114, the 4H 8T245 and the 5S 284 custom IC are all sliced through -- so a
third portion of the sheet is missing, and that is where the sound custom IC's
output and the amplifier are drawn.

All 35 pages were checked, not just the cited one. The rest is assembly drawings
(pp3-5), three small daughter boards (Z-80 sync bus controller, V-RAM addresser,
credit multiplier), cabinet wiring, and the Electrohome monitor's own schematics
and parts lists. No audio sheet anywhere.

What IS established, from the chip list on manual page 35: the game board carries
an LM377 dual audio amplifier. The assembly drawing at PDF p3 places it near R91,
a 10K "T" volume pot, with C48 4.7 uF, C49 47 uF tantalum, C50 0.0047 uF mylar
and C51 330 uF around it. A 4.7 nF mylar capacitor in an audio path is a filter
rather than decoupling. So there is certainly a stage here and the model has none
of it, but HOW those parts connect is not on any page of this scan.

One correction, since this row briefly said otherwise: R28, R29 and the 2N3391A
are NOT audio. Tracing them on PDF p2 puts them in the power-on reset circuit
with D1 and D6. They were read off an assembly drawing without tracing, which is
the mistake this file exists to make visible rather than to commit."""

[[target]]
id = "atari-vector-pokey-output"
machines = ["starwars", "esb"]
status = "missing"
notes = """
EXAMINED, AND IT IS THE LARGEST GAP THIS SWEEP HAS FOUND. Off `unexamined` as
`missing`. Atari SP-225 sheets 16A and 16B, the cleanest drawings in the phase.

BOTH MACHINES ARE COVERED, checked 2026-09-18. There is no ESB audio schematic
and there does not need to be one: ESB shipped only as a conversion kit for a
Star Wars cabinet, so its Sound PCB is this Sound PCB, and the kit's own
instructions say what it does to it. All of section `E. MODIFY THE SOUND PCB` is
to cut the pin-26 traces at the `1H` and `1J/K` sockets, jumper `1J/K` pin 26 to
`3K` pin 23 and to `1H` pin 26, and fit two new ICs, `136031-012` and
`136031-013`. That is digital, it reads like a ROM capacity change, and nothing
analog is touched anywhere in the kit. So every value below applies to ESB
unchanged. Written up in the ESB section of
docs/schematics/starwars-audio-output.md.

The row's own guess was right: the mixer has its own balance and speech does not
arrive at the same level by accident. It is worse than that.

THE FOUR POKEYS ARE NOT WEIGHTED EQUALLY. Into an inverting summer with R30 12k
feedback, CO0 and CO1 come through 47k (gain -0.2553) and CO2 and CO3 through
82k (-0.1463). Two chips are 4.84 dB louder than the other two, where the model
uses one `POKEY_GAIN` of 0.20 for all four. That 0.20 is the MEAN of the board's
four legs (0.2008), so the constant is right about the ensemble and wrong about
every individual chip.

SPEECH IS HOTTER ON THE BOARD. Its leg is 15k, gain -0.8, which against the
POKEY mean is 3.98 where the model's 0.50/0.20 is 2.5: about 4.05 dB.

EACH LEG HAS ITS OWN HIGH-PASS, one 0.1 uF per leg into the virtual ground:
33.9 Hz on the 47k legs, 19.4 Hz on the 82k legs, 106.1 Hz on speech. The model's
single 35 Hz block matches the 47k legs and is THREE TIMES TOO LOW FOR SPEECH.

THERE IS AN ANALOG DELAY LINE, an R5106 bucket-brigade clocked at 37.8 kHz by a
556, with an active filter either side of it. Unmodelled entirely.

STAR WARS IS STEREO BY CONSTRUCTION. Two TL084 sections give LEFT = -(D + A) and
RIGHT = -(D - A) at gains matched to 2.136, where D is the delayed signal and A
the dry: the dry lands entirely in the difference channel and the delayed
entirely in the sum. A difference matrix built out of one op-amp's two inputs.
The model is mono.

Each POKEY is loaded by a TRANSIMPEDANCE AMPLIFIER at a virtual ground, 1k with
1000 pF, which is a third distinct POKEY interface in this sweep after Missile
Command's 10k/0.1 uF and Tempest's 10k/0.015 uF.

Transcribed at docs/schematics/starwars-audio-output.md. Tracked as
phosphor-emulator-82zr. The schematics are PDF pages 114-147 of the
arcade-museum StarWars.pdf, with all the audio on 142 and 143."""

[[target]]
id = "foodf-output"
machines = ["foodf"]
status = "missing"
notes = """
EXAMINED. THE ROW'S OWN QUESTION IS ANSWERED: SP-229 does carry the audio sheet.
The same package whose sheets 7B, 8A and 8B were read for this board's VIDEO
under phosphor-emulator-aih3 carries sheet 10A, `Food Fight Sound`, which is the
whole of the game PCB's audio, and sheet 2B for the amplifier board. Nothing else
had to be fetched. Transcribed at docs/schematics/foodf-audio-output.md.

CONFIRMED: the three POKEYs are mixed 1:1:1. R70, R69 and R71 are all 330k into
one node with R68 22k to ground, so each chip reaches the node at exactly 1/18
before a non-inverting gain of 11, and `(s0 + s1 + s2) / 3.0` is the board's
ratio. Seventh confirmation in this sweep.

THE FINDING IS THE LOAD, AND IT IS A FOURTH DISTINCT ATARI POKEY INTERFACE. Each
pin 37 sits on 910 ohm to +5 V and 0.015 uF mylar to ground, a low-pass at AT
LEAST 11.66 kHz. Missile Command's is at least 159 Hz and Tempest's at least
1061 Hz on the same capacitor value. One chip, four laws, none modelled.

THE SUMMING STAGE IS TEMPEST'S, resistor for resistor, with a third leg: 330k
legs, 22k to ground, 10k and 100k around an LM324 for a gain of 11. First time in
this sweep a shared family HAS predicted a shared stage, and the part that
differs is the same part that differed between Missile Command and Tempest.

ALSO MISSING: the antiphase pair is asymmetric, because `AUDIO+` is DC-coupled
back to pin 37 while `AUDIO-` goes through C48 0.1 uF and R49 100k at 15.92 Hz,
and one DcBlocker at 10 Hz stands in for both; and the Regulator/Audio II PCB
035435-01 rev G, two TDA2002A channels into two speakers where this model is
mono. The model's DcBlocker does correspond to a real part, C6 or C15 on that
amplifier board, exactly as on Missile Command.

FIVE GAMES IN THIS CATALOG NOW END IN A REGULATOR/AUDIO II PCB: Missile Command,
Tempest, Quantum, Food Fight and Crystal Castles. The audio half is the same
circuit on all five and only the output coupling capacitor moves, 1000 uF on
