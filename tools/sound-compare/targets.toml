[[target]]
id = "astdelux-discrete"
machines = ["astdelux"]
status = "partial"
notes = """
MODELED 2026-09-19 in machines/src/astdelux_sound.rs, from sheet 2 side B of the
Cabaret drawing package. Thrust and explosion, which are the two sounds the POKEY
at M7/8 does not make; before this the 0x3600 and 0x3E00 writes were stubs and
audio-latch Q3 was discarded, so both were silent.

`partial` and not `implemented-needs-validation` because nothing has been
compared: there is no adapter and there are no scenarios here, and the unit tests
in the module check the circuit against the drawing rather than against a
reference rendering.

Built from the drawing rather than from a reference netlist, and it differs from
one in three places: the explosion's pitch is the four gates on P7's load inputs
(divide by 16-N, giving 12/6/3/5) rather than a table, its volume is R6's four
preferred values 5.6k/12k/22k/47k rather than a linear fraction, and both paths
share the one R8/P8 register as the board has them rather than each owning a
noise source.

NEEDS VALIDATION on the level the discrete paths sit at against the POKEY. The
three summing resistors into P11 are known (R85 4.7k explosion, R158 3.3k thrust,
R69 100k POKEY, against R86 10k feedback) and they set the ratio *among* the
three, but a weight multiplies a voltage and the POKEY's AUD swing against an
LM324 output is not on any sheet. DISCRETE_SWING_OVER_POKEY is the one fitted
number and the only thing between this and a mix derived entirely from the
drawing. Retiring it means expressing both sides in volts, which is the same open
question asteroids-discrete has for its own mixer; answer them together."""

[[target]]
id = "namco-54xx-explosion"
machines = ["galaga", "xevious"]
status = "partial"
notes = """
MODELED 2026-09-18. The MB8844 runs its own firmware (core/src/device/namco54.rs)
and its three channels reach the summing amplifier through the ladders and
band-passes in machines/src/namco_wsg_output.rs. Transcribed at
docs/schematics/namco-54xx-explosion.md. Tracked as phosphor-emulator-uxi9.

COMPARED AGAINST THE REFERENCE, which is what this row exists for, on Galaga's
self-test explosion captured from reset by both: fundamental 185.4 Hz against
182.6, centroid 296 Hz against 301, and every band within 5 pp. Still
`partial` rather than `implemented-needs-validation`: there is no adapter and
no scenario, so nothing here is reproducible from the catalog yet.

THE 8.5 dB LEVEL GAP IS NOT OURS TO CLOSE, which took measuring both rows to
establish and is recorded so nobody closes it by inserting a constant. Measured
2026-09-18 on Galaga, each emulator against ITSELF, so the arbitrary full-scale
reference cancels:

| | WSG peak | explosion peak | explosion - WSG |
|---|---|---|---|
| reference | -9.79 dBFS | -1.91 dBFS | +7.9 dB |
| ours | -4.07 dBFS | -10.68 dBFS | -6.6 dB |

(WSG figures from sustained gameplay, 0 percent silent: the reference driven
into a game by a Lua autoboot script, ours from the committed movie. Galaga's
WSG is silent in attract, so a from-reset capture cannot show it.)

THE ARITHMETIC IN THIS PARAGRAPH WAS RIGHT AND THE MODEL DID NOT MATCH IT. The
reasoning stands unchanged: the WSG and explosion channel 3 both reach that node
through 10k against the same 3.3k of feedback, so they enter at equal weight, and
channels 1 and 2 at 33k enter a third of that. The WSG node swings to about 0.64
of the 5 V rail AT ONE VOICE'S FULL VOLUME, while the band-pass outputs are
rail-limited to roughly 1.75 V of AC, the op-amp being single-supply with a 2.0 V
reference and clipping 1.5 V below the positive rail. So the WSG belongs ABOVE the
explosion.

WHAT WAS WRONG, CORRECTED 2026-09-18, is that the model's WSG node did not carry
that 0.64. It carried three times it, because `namco_wsg_output` gave each voice
its own divider and summed the three, and the normalization that took the level
back out sits DOWNSTREAM of this summing junction. So the WSG entered this node
9.55 dB hot against the explosion legs, and the -6.6 dB this row recorded was that
error and not the drawing's ratio. The phrase 'at one voice's full volume' is
exactly where the two parted company, and it was sitting in this paragraph the
whole time.

Fixed by modeling the multiplex (phosphor-emulator-mn5w): the node now carries
the charge-balance average that one shared network produces, which is the 0.64 the
paragraph above always assumed. Measured on the attract demo against the
reference, ours went from 8.7 dB BELOW it to 0.83 dB above it.

THAT RETIRES THE EXPLANATION THIS ROW GAVE FOR THE REFERENCE'S +7.9 dB.
`galaga_final_mixer`'s hand gain of 40800 and the separate 0.90 * 10/16 WSG route
are still two independently tuned constants, but they are not what the gap was
made of: most of it was ours. A hand-tuned constant in the reference is a
comfortable thing to blame, and it was the wrong answer here. The -6.6 and +7.9
pair should be RE-MEASURED rather than adjusted by 9.55 on paper, because they
came from the self-test explosion scenario and the figures above are attract-demo
peaks.

Our WSG's own absolute level was the other half of this and is answered in
`namco-galaga-output`: 3.86 dB above the reference content-free, decomposing into
normalization convention and the volume law, neither of them a defect.

NOT EXERCISED: the 100k / 2.5 kHz channel, on R-Port #1, is never driven during
the self-test explosion; over the 560 frames measured its code never leaves 0
while the two O-port channels both reach 15. Nothing here has tested it.

XEVIOUS IS DRIVING THE CHIP, measured 2026-09-18 over the committed movie: the
54XX moves its channels on 117 of 3000 frames, and the explosion at that point
reads f0 184.5 Hz with a 233 Hz centroid against Galaga's 185.4 Hz. That is the
agreement the shared firmware and the identical network predict, and it is the
first evidence the Xevious half of this row does anything at all. It is NOT a
reference comparison; `phosphor-emulator-pd5e` records why one is not here yet.

THE PORT-TO-LADDER ASSIGNMENT WAS THE SOFT SPOT AND IS NOW READ. It used to come
from the reference's discrete network, because the sheet draws the 54XX as a
custom block with pin numbers and no port names. Confirmed 2026-09-17 against
Table 1 of the Fujitsu MB8840 series datasheet laid over the Xevious sheet, and
the reference's assignment was right: pins 20-17 are R-Port #1 into the 100k leg
and the 2.5 kHz filter, pins 11-8 the O port's upper nibble into the 47k and
452 Hz, pins 7-4 its lower nibble into the 150k and 168 Hz. Nothing changed. The
natural reading, that the groups run in ladder order, is what made the explosion
thin and high: the pin groups do run in order down the package but the ladders
they feed do not, so it puts the busy O-port channels through the 2.5 kHz filter
and leaves the near-idle R port driving the 168 Hz one. Written up in
docs/schematics/namco-54xx-explosion.md.

A known CPU discrepancy sits under this: phosphor-emulator-8mez. It does not
change what this row sounds like."""

