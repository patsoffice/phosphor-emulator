[[target]]
id = "congo-percussion"
machines = ["congobongo"]
device = "machines/src/congo_sound.rs"
status = "blocked"
reason = """
There is no reference capture to compare against, and there cannot be one from
an emulator: the reference plays recorded WAVs because it never modelled this
circuit. Comparing against those measures whoever made the recordings. The
reference here is the drawing, so the next step is a rebuild and not a
comparison, and `implemented-needs-validation` is unreachable until one exists.
Tracked as phosphor-emulator-7z54."""
notes = """
THE PHASE'S ORDERING RATIONALE FOR THIS TARGET WAS FALSE, and this row is where
that is recorded. It was listed first on the grounds that its reference is a
different kind, sample playback, which would exercise the claim that the tooling
does not care where a WAV came from.

The board does not play samples. Sound Board 834-5168 sheet 2 has all five voices
as analog circuits: four identical drum channels, each a 7416 open-collector
inverter into a diode-and-RC envelope shaper into a ringing multiple-feedback
band-pass on a 3614, plus a separate gorilla built from two 4538B monostables and
an HM5837 noise IC. Transcribed at docs/schematics/congo-percussion.md, including
the four mixing resistors that set the balance.

The emulator's implementation choice was read as evidence about the hardware.
Reading the drawing took twenty minutes; the belief had been in the plan for
weeks."""

[[target]]
id = "zaxxon-discrete"
machines = ["zaxxon"]
device = "machines/src/zaxxon_sound.rs"
adapter = "zaxxon-discrete"
status = "implemented-unvalidated"
scenarios = [
  "zaxxon/alarm2",
  "zaxxon/alarm3",
  "zaxxon/base-missile",
  "zaxxon/battleship",
  "zaxxon/cannon",
  "zaxxon/homing-missile",
  "zaxxon/laser",
  "zaxxon/m-exp",
  "zaxxon/m-exp-sustained",
  "zaxxon/s-exp",
  "zaxxon/ship-engine-a",
  "zaxxon/ship-engine-b",
  "zaxxon/ship-engine-pair",
  "zaxxon/shot",
]
notes = """
BUILT FROM THE DRAWING, AND THERE IS NOTHING TO COMPARE IT AGAINST. The board has
no sound chip: twelve active-low bits of the i8255 at U23 gate eleven analog
voices, two further bits set a level, and all eleven meet at one passive summing
node the drawing calls SJ. Transcribed in docs/schematics/zaxxon-discrete-sound.md
from IC Board A 834-0214 sheets 11 and 12 (PDF pp132-135, not pp131-135 as this
row previously said: p131 is the cabinet wiring).

`implemented-unvalidated` and NOT `implemented-needs-validation`, which is the
honest end state rather than a waypoint. The reference driver plays recorded WAV
samples, so a comparison against it would measure whoever made the recordings,
and no scenario here will ever change that. It can only reach `validated` by
someone reviewing the device against the drawing, which is a different piece of
work from anything sndcmp does.

THE ADAPTER AND SCENARIOS ARE NOT A CLAIM THAT SUCH A COMPARISON EXISTS. This row
previously said there could be none because there was nothing to compare against,
and that was half the picture: the other comparison this tool supports is one
revision of a device against the next, and on a board transcribed by hand from a
1982 drawing that is the comparison that keeps paying. Reading `R96` off the
wrong node moved the battleship two octaves, and the way that was told from an
improvement was to capture the voice either side and listen to both. Thirteen
scenarios, at least one per voice, exist so that is one command rather than a
scratch test somebody writes again each time.

The samples do have one honest use, and the engine is the worked example. They
say what a voice IS and they are how you notice that something is wrong: putting
the two engine captures beside 04.wav and 05.wav is what showed that our two
engine tones were measurably identical when the board's are an octave apart, and
re-reading sheet 12 is what found the reason (they are Sallen-Key low-passes,
not band-passes). What the samples cannot do is place a constant, and the same
comparison shows why: both of them are an octave wide and this board's engine
front end is 68 Hz wide at every LDR position, which is arithmetic on R21 and
C26. Two constants have been fitted to these recordings in the past and both
were reverted.

reference/zaxxon-ab.sh builds both comparisons as wavs you can actually listen
to: every voice beside its sample, and every voice beside a previous revision's
capture. It carries the voice-to-sample mapping from MAME's zaxxon_a.cpp and,
per voice, the window that makes our capture the same LENGTH as the sample it is
held against, which matters more than it sounds like: these voices run from
47 ms to 3.8 s and a mismatched window moves the 125-250 Hz band by 5 dB on its
own. Its before/after half also prints how far each voice moved, so a change
meant to touch four voices can be shown to have touched four: the other eight
null out 66 to 84 dB down, which is this board's equivalent of a byte-identical
golden frame.

What IS derived, and is what a review would check: the seven 74123 one-shot
widths at the plain part's 0.28 constant, the three Sallen-Key noise bands, the
two Sallen-Key engine tones and the R26/R27 divider after them, the
556-into-74393 alarm divider, the player ship's two-bit level solved as a
resistive network, both battleship oscillators and the 50 % duty and 3.378 Vpp
swing that follow from their resistors, and the eleven-leg mix, whose balance is
entirely the attenuator ahead of each leg because the summing resistors are all
the same 51k.

What is NOT: the MCD-725H opto-isolator's transfer curve, the MB4391's control
law beyond its direction, Q6's collector-emitter resistance, the op-amps' output
swing, and the shot's oscillator pitch. Each is named INVENTED in place in the
device."""

[[target]]
id = "atari-system1-audio"
machines = ["marble", "roadrunner"]
device = "machines/src/atari_system1_sound.rs"
status = "implemented-unvalidated"
notes = """
THE REASON THIS FILE EXISTS. An implemented discrete device with no adapter, no
scenarios, and no mention in any phase of the epic. It was not deferred or
blocked; it was simply never written down, and stayed invisible until someone
listed the sound devices by hand.

Now owned by phosphor-emulator-irx4 rather than by no one. It was deliberately
