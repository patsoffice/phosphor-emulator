All five voices within 0.44 dB of the reference on level, and within 0.15
percentage points on every band. The whole board had been 25 dB down: the output
normalization was a fitted 14347 where the mixer's own leg sum is the answer, and
the same peak-to-peak convention was missed again on the tone gain, which put the
