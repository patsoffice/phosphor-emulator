[[target]]
id = "dkong-discrete"
machines = ["dkong"]
device = "machines/src/dkong_sound.rs"
adapter = "dkong-discrete"
status = "implemented-needs-validation"
scenarios = ["dkong/walk", "dkong/jump", "dkong/stomp"]
notes = """
All three effects and the music built from the board rather than fitted. Walk
carries a labelled trade: closing a 13-point gap below 150 Hz cost brightness in
the band a previously fitted filter had been holding up. Shipped labelled rather
than re-fitted."""

[[target]]
id = "dkongjr-discrete"
machines = ["dkongjr"]
device = "machines/src/dkongjr_sound.rs"
adapter = "dkongjr-discrete"
status = "implemented-needs-validation"
scenarios = [
  "dkongjr/walk",
  "dkongjr/walk-hi",
  "dkongjr/jump",
  "dkongjr/climb",
  "dkongjr/fall",
]
notes = """
Four voices where the board previously played Donkey Kong's three. Walk and jump
within tolerance on every metric.

THE CENTROID RESIDUALS CLOSED, and not for the reason this row used to give. The
falling voice was attributed to edge quantisation
(phosphor-emulator-discrete-square-edge-quantisation-jtn3); the cause was
actually the output resampler being fed at a rate incommensurate with its own
intermediate rate, found in phosphor-emulator-tohy and fixed in
phosphor-emulator-6ykk. Falling went 1417.2 to 952.9 against the board's 941.8,
and walk-hi 302.0 to 232.3 against 209.0, both inside tolerance on the
re-derivation that established those reference figures.

THE OUTPUT STAGE HAS SINCE BEEN READ off sheet 5, and it is an emitter follower
identical to Mario Bros.'s: C155 0.01 uF shunting the summing node, C161 1 uF
into Q1's base with R29 100k / R38 43k bias, R1 150 emitter and R39 1k
collector, then C13 4.7 uF off the emitter into the 10k volume control. This
file previously modeled all of that as one coupling into "the MB3712's 1 kOhm
input", which is not on the drawing. That also confirms the summing node's
0.01 uF, which used to come from an independent netlist and now comes from the
sheet.

THE REFERENCE DOES NOT MODEL THIS STAGE AND CANNOT ARBITRATE IT. MAME's
dkongjr_discrete uses DISCRETE_CRFILTER(1000, C13), the same 1 kOhm that is not
on the drawing, and its mixer's coupling capacitor runs against a hardcoded
100 kOhm that its own source calls "an average final stage impedance" rather
than anything from this board. So the two models' low-frequency responses differ
by construction, and the centroid figures below diverge for that reason rather
than because either is broken: falling reads 927.6 against the reference's
941.8, and walk-hi 148.6 against 209.0. Above a few hundred hertz the two still
agree. Treat this board's low end as unarbitrated until a capture from hardware
exists.

Remaining residual: climbing's onset steps where the board's does not."""

[[target]]
id = "galaxian-discrete"
machines = ["galaxian"]
device = "core/src/device/galaxian_sound.rs"
adapter = "galaxian-discrete"
status = "implemented-needs-validation"
scenarios = [
  "galaxian/background",
  "galaxian/fire",
  "galaxian/hit",
  "galaxian/melody",
]
notes = """
Two of its three reported residuals turned out to be the reference's own
simulation rate rather than the model. References for this board must be
captured at 192 kHz and band-limited afterwards.

This board also carried the incommensurate-resampler artifact fixed in
phosphor-emulator-6ykk, which named only the two Nintendo boards; this one calls
`with_sim_rate` too and was missed. It is unharmed either way, all four scenarios
staying within tolerance across the fix, because its voices are the few-kHz kind
with little ultrasonic content for the jitter to scramble."""

[[target]]
id = "mariobros-discrete"
machines = ["mariobros"]
device = "machines/src/mario_sound.rs"
adapter = "mariobros-discrete"
status = "implemented-needs-validation"
scenarios = ["mariobros/walk1", "mariobros/walk2", "mariobros/skid"]
notes = """
Two footsteps, the skid, and the music through two LM3900 sections. The trigger
discipline was traced from recorded play and the scenarios' timeline is
confirmed correct: the skid is held exactly three frames in all 33 assertions,
and the footsteps are write strobes with no hold to get wrong. See
tools/script/examples/mario_sound_trace.rhai. What that trace also found is a
coverage gap rather than a defect: the game strobes a footstep every one or two
frames while walking, against a one-shot two frames wide, so the real walking
voice is one continuously retriggered tone and no scenario drives that. Luigi's
line is never written in the recording, which is single-player, so walk2's
discipline stays unmeasured.

THE MODEL IS CONFIRMED AGAINST THE DRAWING, VALUE BY VALUE, at 600 dpi: every R
and C, the diode-fed one-shots, both output couplings, and the whole emitter
follower down to VR1. There is no component defect in it. The residual against
the reference is 37.6, 49.3 and 209.8 against 26.6, 31.6 and 156.6, roughly
1.4x, after the resampler fix (phosphor-emulator-6ykk) and after Q10's beta was
sourced from the same model card the reference uses.

EVERY MECHANISM INSIDE THE MODEL IS ELIMINATED, measured rather than argued:
resolution moves under 3 % over 4x, logic levels move the wrong way and would
need a level above the rail, gate bandwidth sits three decades above the band,
the one-shot width saturates, and the follower's input impedance agrees with the
full Gummel-Poon device physics to 0.5 %.

WHAT THE VOICE IS, because it is not what the metric suggests. 97.6 % of a
footstep's energy is in the lowest band with a 21.5 Hz rolloff, while its two
oscillators sit at 787 and 939 Hz and contribute 1.7 %. The voice is a thump: the
gated mean of the XOR square switched on for 32 ms and differentiated by the two
couplings. Anyone tuning tone accuracy here is working on 1.7 % of the energy.

THREE DEFECTS ARE ESTABLISHED IN THE REFERENCE, all pushing the direction of the
residual: R18 at 30k where the drawing reads 27k, making its Luigi one-shot 11 %
long while its own comment calls 27 verified; the one-shot diode guessed as a
1N4148 with a FIXME where the board has a 1S953, when the forward drop is the
whole mechanism; and Vaf=6 on the transistor that sets the coupling corner, an
order of magnitude below a real 2SC1815 and worth 13 % of that corner.

So this is two models of one circuit, not a model against a board, and the one
with errors in it is not ours. Closed as unarbitrated: settling it needs a
capture from hardware, which nobody has, or the three defects corrected in a
local copy of the reference netlist and the figures re-derived. See
phosphor-emulator-qf2x for the full elimination. The skid's reference figure was
separately disputed and settled at 156.6 (phosphor-emulator-87r8)."""

[[target]]
id = "llander-discrete"
machines = ["llander"]
device = "machines/src/llander_sound.rs"
adapter = "llander-discrete"
status = "implemented-needs-validation"
scenarios = [
  "llander/thrust",
  "llander/thrust-low",
  "llander/explosion",
  "llander/tone-3k",
  "llander/tone-6k",
]
notes = """
All five voices within 0.44 dB of the reference on level, and within 0.15
percentage points on every band. The whole board had been 25 dB down: the output
normalization was a fitted 14347 where the mixer's own leg sum is the answer, and
the same peak-to-peak convention was missed again on the tone gain, which put the
tones a further 6 dB out of balance. Both are now derived from the drawing,
transcribed at docs/schematics/llander-audio-output.md.

Residuals, none of them findable by comparison because the reference shares them:
the throttle's three resistors also set the noise filter's corner, so the board's
quieter thrust is darker and its volume law is not linear; two make-up gains are
still fitted; and the explosion clips 9.5 % of samples where the reference clips
9.9 %, which the board would not. All three in phosphor-emulator-b72s."""

