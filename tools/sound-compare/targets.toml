[[target]]
id = "gottlieb-output"
machines = ["qbert"]
device = "machines/src/gottlieb.rs"
status = "partial"
notes = """
EXAMINED. Sound/Speech Assy. A6 schematic, transcribed at
docs/schematics/qbert-sound-output.md. `partial` because two of the three things
that looked like gaps turned out to be modelled already, and the third is real.

ALREADY MODELLED, and worth recording so nobody re-finds it: both MC1408s are
accounted for. U19 and U20 are each an 8-bit DAC off a pair of 74LS75 latches
with its own strobe; one is the audio DAC and the other steers the SC-01's clock,
and gottlieb.rs has `Mc1408Dac` for the first and a clock-rate function for the
second. The post-sum coupling capacitor is modelled too, with a comment that
already reasons correctly about why it belongs after the sum.

THE GAP IS THE MIX. The two sources do not arrive at the amplifier as a plain
sum: each has its own 10k trimmer (R15, R16) with its own 0.047 uF coupling
capacitor (C31, C32), and the two wipers meet at a node feeding R18 100k into a
U23 LM379S on +30 V. So the DAC-to-speech balance is TWO PARTS, where the model
has the literal 32000.0 it scales the Votrax by, and each leg is AC-coupled
BEFORE the sum where the model couples once after it. Those are not the same
filter. The cabinet adds a 100 ohm 2 W volume control into a 4 ohm 5 W speaker.

Not traced: which source drives which trimmer, and what the two LM741 inverters
around the voice-clock oscillator do to the levels. The model's linear
"plus or minus 5.5 kHz per DAC step" is a straight-line fit to a transistor
oscillator whose parts are on this sheet and were not worked out.
phosphor-emulator-i8y7."""

