[[target]]
id = "gridlee-output"
machines = ["gridlee"]
device = "machines/src/gridlee.rs"
status = "blocked"
reason = """
Gridlee was never released, so there is no manual and no schematic to read, and
there is not going to be one. `unexamined` would be wrong: it says nobody has
