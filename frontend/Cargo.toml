[package]
name = "phosphor-frontend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "phosphor"
path = "src/main.rs"

[dependencies]
phosphor-core = { path = "../core" }
phosphor-machines = { path = "../machines" }
phosphor-harness = { path = "../harness" }
phosphor-script = { path = "../tools/script" }
rhai = "1"
sdl2 = "0.38"
# These two move together or not at all: egui_sdl2_gl is built against one
# egui version, so egui cannot be bumped past whatever the backend supports.
# egui is at 0.36 upstream, but 0.33.2 is the newest egui_sdl2_gl there is, so
# the ceiling here is the backend's release cadence and not our own.
egui_sdl2_gl = { version = "0.33", default-features = false }
egui = "0.33"
gl = "0.14"
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
dirs = "6"
png = "0.18"
