[package]
name = "phosphor-frontend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "phosphor"
path = "src/main.rs"

[dependencies]
phosphor-core = { path = "../core" }
phosphor-machines = { path = "../machines" }
phosphor-harness = { path = "../harness" }
phosphor-script = { path = "../tools/script" }
rhai = "1"
sdl2 = "0.38"
# These two move together or not at all: egui_glow releases in lockstep with
# egui, so they bump as a pair. glow arrives as egui_glow::glow with no direct
# entry, which keeps it from drifting out of sync with the painter.
egui_glow = { version = "0.35", default-features = false }
egui = "0.35"
gl = "0.14"
clap = { version = "4", features = ["derive"] }
toml = "1"
serde = { version = "1", features = ["derive"] }
dirs = "6"
png = "0.18"
log.workspace = true
env_logger.workspace = true
