name: CI

# Four jobs with deliberately different responsibilities.
#
# `check` is the gate. It runs on every push and pull request, must stay fast,
# and is pinned to the same rustc the Nix dev shell provides so that "clippy is
# clean locally" and "clippy is clean in CI" mean the same thing. It does NOT
# fetch the SingleStepTests submodules; without them the six single-step
# validators skip (see `require_test_data` in cpu-validation/src/lib.rs),
# reporting success while validating nothing — which is fine here, and is
# exactly why `validate` exists.
#
# `future` is an early-warning signal, not a gate. It runs the same lints on
# current stable and is allowed to fail: a newer rustc regularly adds
# future-compatibility lints that will become hard errors later, and we would
# rather see those on a schedule than discover them the day the pin moves.
# When it goes red, fix the code — do not silence the job.
#
# `audit` checks Cargo.lock against the RustSec advisory database. Scheduled
# rather than per-push on purpose: an advisory is published on the world's
# timetable, not ours, so it has no business failing a PR that did not touch
# dependencies. It is not marked continue-on-error, though — off the PR path a
# red run means something real, and dependency updates are exactly when it
# should be consulted. Same check locally: `nix develop -c cargo audit`.
#
# `validate` fetches the submodules, generates the M6800/M6809 vectors, and
# runs all 7.1M of them with PHOSPHOR_REQUIRE_VECTORS set, so a missing set is
# a failure there rather than the skip it is everywhere else. It is scheduled
# rather than per-push because the submodules are large and the run is long. A
# permanently-skipping validator in `check` is only safe while `validate` is
# actually green — if this job starts failing or stops running, treat those
# CPUs as unvalidated.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Emulation is the workload; never let a panic unwind silently in CI.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 and GL headers
        # phosphor-frontend is the only crate with system dependencies, but
        # `--workspace` builds it, so the whole job needs them. The flake pins
        # the same set (SDL2, libGL, pkg-config) for local development.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libgl1-mesa-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.97.1
        # Pinned to the rustc the flake provides, so a clean local clippy run
        # means a clean CI one. Keep in sync when `nix flake update` moves it:
        #   nix develop -c rustc --version
        # The `future` job below is what watches newer toolchains.
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      - name: Tests
        # ROM-gated tests (frameshot parity, and the golden frames to come)
        # skip cleanly with PHOSPHOR_ROMS unset — arcade ROMs are not
        # redistributable, so CI can never run them.
        run: cargo test --workspace --locked

  future:
    name: stable toolchain (early warning)
    runs-on: ubuntu-latest
    # Advisory only. A red run here means current stable has started rejecting
    # something the pinned toolchain still accepts — usually a
    # future-compatibility lint on its way to becoming a hard error. It must
    # never block a merge, and it must never be "fixed" by relaxing the lint.
    continue-on-error: true
    # Skipped on pull requests: PR feedback should stay fast, and this signal is
    # about the passage of time rather than about any one change.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 and GL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libgl1-mesa-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # Its own cache: sharing one with `check` would thrash, since the two
          # jobs compile the same crates with different compilers.
          key: stable

      - name: Report the toolchain under test
        run: rustc --version

      - name: Clippy on current stable
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  audit:
    name: RustSec advisories
    # Not on pull requests: see the header. Pushes to main, the Monday cron, and
    # manual runs are enough to keep the lockfile honest.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # audit-check reports through a check run, which the default read-only
    # token cannot create: the step failed with "Resource not accessible by
    # integration" while the audit itself had found nothing. Without this the
    # job goes red on a permissions error and looks like an advisory.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      # No SDL2 or toolchain setup: cargo-audit reads Cargo.lock as data and
      # never builds the workspace, so the system dependencies are irrelevant.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: CPU validation (7.1M vectors)
    # Long and bandwidth-heavy; not worth running per push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The 65x02 / z80 / 8088 / 680x0 vector suites.
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate M6800 and M6809 vectors
        # These two suites are generated rather than vendored;
        # cpu-validation/test_data is gitignored in full.
        #
        # No working-directory needed: the generators resolve their output
        # against CARGO_MANIFEST_DIR, so they write where the validators read
        # whatever directory they are invoked from. This step used to have to
        # run from cpu-validation, and getting that wrong put the vectors one
        # level too high, made every validator skip, and left the job green
        # having checked nothing.
        run: |
          cargo run --release --locked -p phosphor-cpu-validation --bin gen_m6800_tests -- all
          cargo run --release --locked -p phosphor-cpu-validation --bin gen_m6809_tests -- all

      - name: Run single-step validators
        # This job's whole value is that it does not skip, so require the
        # vectors rather than trusting a green run: PHOSPHOR_REQUIRE_VECTORS
        # turns a missing directory from a silent skip into a failure that names
        # it. There used to be a hand-written list of the expected directories
        # here, which was a second copy of what the tests already know and would
        # have rotted the first time one of them moved.
        #
        # --nocapture so the per-CPU vector counts reach the log; libtest hides
        # stderr for a passing test.
        env:
          PHOSPHOR_REQUIRE_VECTORS: 1
        run: cargo test --release --locked -p phosphor-cpu-validation -- --nocapture
