[package]
name = "phosphor-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
phosphor-core = { path = "../core" }
phosphor-machines = { path = "../machines" }
zip = "2"

# Dev-only: the golden-frame suite reads its pinned data as TOML, fingerprints
# frames with SHA-256, and writes/decodes reference PNGs. Deliberately not real
# dependencies — the frontend links this crate and gains none of them.
[dev-dependencies]
png = "0.17"
sha2 = "0.10"
toml = "0.8"
