# What each machine's audio is allowed to look like after a short headless boot.
#
# `audio_sanity_test.rs` boots every registered machine, captures ten seconds,
# and asserts three things that need no reference capture and no MAME: the
# output is not sitting on a large DC offset, is not permanently saturated, and
# is not permanently silent. Those are the audio counterpart of
# `golden_frame_test`'s guards — defects visible without knowing what the
# machine is supposed to sound like.
#
# There are two kinds of entry, and they mean opposite things.
#
#   [[correct]]        this machine really is like that, and here is why.
#   [[known_defect]]   this machine is broken, and here is the issue tracking it.
#
# `known_defect` is a RATCHET, not a skip list: the test asserts such a machine
# is *still* defective. Fixing one fails the suite until its entry is deleted,
# so the list can only shrink and cannot quietly absorb a new regression. That
# is the difference between an inventory of known bugs and a place where
# failures go to be forgotten.
#
# A machine with no entry must pass the defaults. Registering a new machine
# needs no entry here unless it fails.

[defaults]
# Mean sample as a fraction of full scale. A large offset means a stuck source,
# a wrong bias, or a missing coupling capacitor, and it eats the headroom every
# real voice needs.
max_dc_offset = 0.05
# Fraction of samples pinned at the rail.
max_clipped_fraction = 0.01
# Fraction of the capture that may be silent. Attract mode is often quiet, so
# this is loose by design — it is here to catch a machine that emits *nothing*,
# not to police how busy a demo loop is.
max_silent_fraction = 0.999

# ---------------------------------------------------------------------------
# Correct: silent by design
# ---------------------------------------------------------------------------
# Verified by capture — `disasm frameshot --machine <m> --frames 600
# --audio-out /tmp/x.wav` yields an all-zero WAV. This is the documented
# behaviour of the Atari vector boards and the reason
# `tools/sound-reference/`'s Lua drivers poke their sound registers directly
# instead of waiting for attract mode to do it.

[[correct]]
machine = "asteroid"
silent = true
reason = "silent attract mode by design; the board makes no sound until coined up"

[[correct]]
machine = "llander"
silent = true
reason = "silent attract mode by design; the board makes no sound until coined up"

# ---------------------------------------------------------------------------
# Known defect: pinned output
# ---------------------------------------------------------------------------
# Measured 2026-08-19 on a ten-second headless boot. These are not quiet — they
# are jammed against a rail, which costs the entire output range.

[[known_defect]]
machine = "missile"
dc = true
clipping = true
reason = "output constant at -1.0: 100% clipped with AC RMS at -200 dBFS, i.e. no AC content whatsoever"
issue = "phosphor-emulator-audio-dc-saturation-sweep-whri"

[[known_defect]]
machine = "joust"
dc = true
clipping = true
reason = "DC -1.0 with 99.996% clipped; a real but tiny signal rides on a pinned rail"
issue = "phosphor-emulator-audio-dc-saturation-sweep-whri"

[[known_defect]]
machine = "mariobros"
