# ---------------------------------------------------------------------------
# Known defect: no audio at all
# ---------------------------------------------------------------------------
# Every one of these produces a capture whose peak is -200 dBFS — digital zero
# for the entire ten seconds, including the boot window. Deliberately recorded
# as defects rather than as `[[correct]] silent = true`: several of these boards
# demonstrably make sound at power-on (Pac-Man's startup jingle among them), so
# calling them "silent by design" would be inventing a hardware claim to make a
# test pass. Whether the sound path is not driven from a headless boot, needs a
# coin, or is genuinely unimplemented is what the tracking issue is for.

[[known_defect]]
machine = "pacman"
silence = true
reason = "no audio at all from a headless boot, though the board plays a startup jingle on real hardware"
issue = "phosphor-emulator-headless-audio-silent-sweep-pql6"

[[known_defect]]
machine = "mspacman"
silence = true
reason = "no audio at all from a headless boot; shares the Pac-Man sound path"
issue = "phosphor-emulator-headless-audio-silent-sweep-pql6"

