# What each machine's audio is allowed to look like.
#
# `audio_sanity_test.rs` runs every registered machine, captures its audio, and
# asserts three things that need no reference capture and no MAME: the output is
# not on a large DC offset, is not permanently saturated, and is not permanently
# silent. The audio counterpart of `golden_frame_test`'s guards.
#
# THE FIXTURE MATTERS MORE THAN THE THRESHOLDS. The suite replays a recorded
# input movie when one exists and falls back to an input-free boot when none
# does, and it only judges *silence* on a movie. An input-free boot sits in
# attract mode, where most arcade boards are legitimately silent until coined
# up, so calling that silence a defect measures the fixture rather than the
# machine. This file previously carried 23 machines listed as silent for exactly
# that reason; every one of them turned out to produce healthy audio under
# replay, and the ratchet below is what forced the correction.
#
# There are two kinds of entry, and they mean opposite things.
#
#   [[correct]]        this machine really is like that, and here is why.
#   [[known_defect]]   this machine is broken, and here is the issue tracking it.
#
# `known_defect` is a RATCHET, not a skip list: the test asserts such a machine
# is *still* defective. Fixing one fails the suite until its entry is deleted,
# so the list can only shrink and cannot quietly absorb a new regression.
#
# A machine with no entry must pass the defaults. Registering a new machine
# needs no entry here unless it fails.

[defaults]
# Mean sample as a fraction of full scale. A large offset means a stuck source,
# a wrong bias, or a missing coupling capacitor, and it eats the headroom every
# real voice needs.
max_dc_offset = 0.05
# Fraction of samples pinned at the rail.
max_clipped_fraction = 0.01
# Fraction of a *movie* capture that may be silent. Loose by design — this
# catches a machine that emits nothing during recorded play, not one with quiet
# passages.
max_silent_fraction = 0.999

# ---------------------------------------------------------------------------
# No machine is a known defect
# ---------------------------------------------------------------------------
#
# There were fifteen. Every one is fixed, and the list below is kept because
# what they had in common is worth more than the entries were.
#
# THIRTEEN WERE ONE FAULT: a sound chip whose output swings from ground up rather
# than either side of it, feeding the amplifier with no coupling capacitor in
# between. Five different parts, one omission.
#
#   mariobros                     MC1408 ladder    DC -0.530 -> -0.0014
#   docastle, dorunrun, dowild    4x SN76489A      DC +0.130 -> +0.0000
#                                                     +0.120 -> +0.0001
#                                                     +0.208 -> +0.0000
#   burgertime                    2x AY-3-8910     DC +0.196 -> +0.0001
#   qbert                         MC1408 + speech  DC -0.447 -> -0.0001
#   ccastles                      2x POKEY         DC -0.973 -> -0.0000
#   mrdo                          2x SN76489       DC +0.183 -> -0.0000
#   missile, quantum, foodf,      (fixed earlier, same shape)
#     sinistar, dkong
#
# mrdo is the one that says why the fixture matters. It sat clean for as long as
# it had no recorded movie: the fallback boot measures attract mode, Mr. Do!'s
# attract mode is silent, and a silent capture has no offset to report. It read
# dc +0.0000, 100% silent, peak -200 dBFS, and passed. It took recording a movie
# for every machine before the board played at all, and then it read +0.183 --
# the same fault as its SN76489 cousins on the Do's Castle board, and in the same
# range as theirs.
#
# A SECOND STATISTIC MOVES WITH THE FIX, in the direction that looks wrong.
# Silence is counted over blocks where every sample is below 1e-4. An uncoupled
# board sits at exactly zero between voices; a capacitor discharges instead, so
# quiet passages carry a decaying tail and stop counting as silent. Coupled
# boards read low (docastle 1.61%, dorunrun 0.00%, dowild 6.41%, burgertime
# 13.03%) and uncoupled ones read high (xevious 35.57%, digdug 38.44%, galaga
# 39.87%). mrdo went 20.82% -> 2.68% along with its offset. A machine crossing
# from one population to the other on both axes is the fix working, not a
# regression.
#
# None of those chips was modelled wrongly: each matches its reference
# implementation, and a unipolar swing is what the silicon does. What was
# missing every time was the board's analog side. If a new machine shows a DC
# offset, look for the coupling capacitor before looking at the chip.
#
# TWO WERE GAIN, NOT BIAS: joust and robotron had clean offsets and still drove
# the rail, 4.9 % and 16.2 % of samples. Their MC1408 was mapped across the whole
# i16 range, which leaves no headroom for the shift that removing a pedestal
# applies. The board runs that part at a quarter of full scale, which is also
# what the reference routes it at, and both went to 0.00 % clipped.
#
# ccastles is worth singling out. It had tried to centre its two POKEYs by
# subtracting a constant 1.0, which assumes both chips sit at half scale on
# average. They sit near zero, so the subtraction pinned the output at the
# negative rail: that one constant was both its -0.97 offset AND its 74 %
# clipping. Removing an offset needs the running mean, not a guess at it.
#
# The Do's Castle three share one board, so one capacitor cleared all of them,
# and their clipping went with the offset. Worth knowing for what remains: an
# offset of this shape is the analog side missing, not the chip being modelled
# wrongly, and both chips match their reference implementations exactly.

# Road Runner's output reads as rail-pinned from the commit that gave DIVU and
# DIVS their real data-dependent internal time, and passed on the commit before
# it. Established by stashing that change alone: 13 of 13 without it, 12 of 13
# with it. Nothing in the audio path changed.
#
# **MEASURED, and the two candidate answers are now settled separately.** The
# captures either side of that commit were written out and compared with
# `disasm audiodiff`.
#
# The window did NOT move. Both captures have the same onset to the
# millisecond, the same nine events at the same 0.833 s spacing, the same
# attack, the same T20 decay, an envelope alignment of 0.000 s, the same
# largest discontinuity within 0.1 ms, and event energies 0.1% apart. Whatever
# this machine is playing, it is playing the same sequence at the same times.
#
# The level did rise, and not as gain: AC RMS +2.88 dB, and the band energies,
# which are scale-invariant, moved by up to 11.7 points, with 400-1000 Hz
# gaining what 0-150 Hz and 1000-3000 Hz lost. The same events are being played
# over denser simultaneous content.
#
# **And it was already at the rail before the change.** Peak was 0.00 dBFS on
# both sides, and clipping went 0.350% to 1.029% against a 1.00% tolerance:
# this board's mix crossed the line by 0.029 of a percentage point, having
# already been at a third of it. So the rail-pinning is a property of the Atari
# System 1 audio path, which is unmodeled analog rather than a CPU defect, and
# the divide fix is what made it visible. That path is
# phosphor-emulator-irx4's.
#
# Entered as a defect rather than as correct because a `correct` entry has to
# state a hardware reason, and "the mix reaches the rail" is a reason to model
# the output stage, not a reason to accept the reading. The ratchet asserts the
# machine is still like this and fails the moment it stops being.
#
# **THE ENTRY IS GONE BECAUSE THE RATCHET FIRED, AND WHAT MOVED WAS THE
# MACHINE, NOT THE OUTPUT STAGE.** Clipping fell from 1.029% to 0.70% when the
# bit operations on a data register stopped charging their documented maximum
# unconditionally (`phosphor-emulator-4sdm`, Table 8-8's asterisk). Nothing in
# the audio path changed again, and the mix still peaks at 0.00 dBFS, so the
# rail is still being reached: it is reached on fewer samples because a
# slightly quicker 68010 feeds the sound board on slightly different clocks.
#
# That is the same sensitivity that put this reading over the line in the first
# place, now pointing the other way, and it is the reason the figure is quoted
# with its history rather than on its own. 0.70% sits between the 0.35% this
# board read before the divide fix and the 1.03% it read after, so half the
# movement that commit caused has come back from an unrelated timing change.
# **The unmodeled analog output stage is untouched and is still
# phosphor-emulator-irx4's**, and phosphor-emulator-idaz still owns the
# question of what this board should actually read. The defect is delisted
# because it no longer reproduces, which is what the ratchet asks, and not
# because anyone modeled the thing that causes it.
