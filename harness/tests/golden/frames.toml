[[frame]]
machine = "congobongo"
frames = 1800
shows = "Attract demo: stage 1's isometric hill with the gorilla at the top right, the blue river, and the ape hopping between the burrows. The picture is the same one it has always been; the hash moved when the color PROM's DAC was corrected. The 3-3-2 ladder had been normalized per channel, which let the two-bit blue reach 255, where the board runs all three channels into equal 470 ohm pulldowns with no gain stage between them and the monitor, so blue tops out at 247. That shifts almost every color slightly and so almost every pixel, without moving anything on screen. Confirmed against a reference capture: the header text now matches it exactly, (0, 222, 247) and (222, 222, 247) on identical pixel counts, where before it was (0, 201, 255) and (201, 201, 255). The circuit is transcribed in docs/schematics/zaxxon-color-dac.md."
size = [224, 256]
frame = "sha256:ef6b4191ae4e9c2caeb4170f0616b9f74951b510715a5d1cdadb7b285400c2ca"

