# ---------------------------------------------------------------------------
# GORILLA, PB1 on sheet 1. PDF p17, with its tail on p18's left edge.
#
# Not a filtered noise burst, which is what the prose's block reading and the
# device both assume. It is a RELAXATION OSCILLATOR (an integrator on U17 and a
# Schmitt trigger on U16 that switches Q2) whose rate is set by a control
# voltage made of an envelope plus low-passed noise: a growl whose pitch
# wanders. Its square wave is scaled, low-passed, and then gated by U15 under a
# second, longer envelope. Two 4538B monostables time the two envelopes, and a
# NOR combines them so the pitch envelope starts only as the first one ends.
# ---------------------------------------------------------------------------

# --- the noise, and its low-pass ---

[[parts]]
group = "gorilla"
ref = "BF3"
kind = "U"
device = "ferrite bead"
pins = ["a", "b"]
note = """
A bead in the HM5837's +12 V feed. No value is drawn, and an `L` must carry \
henries, so it is transcribed as a two-pin part rather than given an invented \
inductance. It carries supply, not signal."""

[[parts]]
group = "gorilla"
ref = "C45"
kind = "C"
uf = 33
note = "electrolytic across the HM5837's supply, + on the bead side."

[[parts]]
group = "gorilla"
ref = "C46"
kind = "C"
uf = 0.1

[[parts]]
