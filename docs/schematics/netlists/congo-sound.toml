# Congo Bongo's sound board, 834-5168, at pin level: the four drum voices.
#
# Filed under phosphor-emulator-7z54. The prose beside it,
# `docs/schematics/congo-percussion.md`, was read at block level and is
# corrected by this file in two places, both found at pin level:
#
#   - THE DRUMS ARE BRIDGED-T RESONATORS, NOT MULTIPLE-FEEDBACK BAND-PASSES.
#     The shaped pulse enters each 3614 section's NON-inverting input through
#     the series resistor, with a resistor to ground and a bias divider on the
#     same node. The feedback is the "1M" from output to the inverting input
#     with two equal capacitors in series across it and the "small resistor"
#     from their junction to ground: a bridged-T. The prose listed the right
#     parts and named the wrong filter.
#   - EACH VOICE HAS ITS OWN BIAS DIVIDER from +12 V, decoupled by an
#     electrolytic: R27/C22/R26 for the bass, R37/C28/R36, R47/C34/R46 and
#     R57/C40/R56 for the others. The prose table lumped R37 in with the bass.
#
# And the rim is not a bridged-T but a TWIN-T: R60 and R61, 2.2M each, run in
# series from its inverting input to its output with C43 from their junction to
# ground, in parallel with the bridged-T the other three have.
#
# And the gorilla is not a noise burst but a relaxation oscillator whose rate
# follows an envelope plus low-passed noise, gated by U15 under a second
# envelope. See its section below.
#
# EXCERPT: THE AUDIO PATH. All of sheet 2 (PDF pp17-18), the four drums and the
# gorilla; and sheet 1's analog side (pp15-16), the two SN76489As' outputs, the
# two summers SJ joins, the +6 V regulator and the connector's audio pins. Not
# here: sheet 1's CPU, ROM, RAM, decode and PPI, which are digital.
#
# HOW TO READ THE SCAN. Each page is a 1013 x 1318 8-bit grayscale JPEG, 120 dpi
# on the letter page. Grayscale holds up better than the number suggests (better
# than Zaxxon's 1-bit 150 dpi): values and pin numbers are legible at 2x, and
# junction dots are the reading to doubt. EVERY PAGE OF THE SOUND BOARD, pp15-18,
# IS FLIPPED TOP TO BOTTOM, which the prose did not record, so flip before
# reading anything with a direction. Each sheet is split across two pages that
# overlap at the seam (R91 is drawn on both p17 and p18):
#
#   pdfimages -j -f 15 -l 18 congobongo5.PDF pg
#   magick pg-003.jpg -flip p18.png
#
# ELECTROLYTICS: pin `a` is the + end, as the drawing marks it.
#
# THE OP-AMP. `3614` is printed at every section and was not identified. The
# symbols mark + and - at each, which is what `op_amp` records; whether the part
# behaves as a conventional op-amp (rather than, say, a Norton amplifier) is an
# assumption the solve inherits, and is said again where it matters.

[board]
name = "Congo Bongo sound"
assembly = "834-5168 A"
source = "arcade-museum.com/manuals-videogames/C/congobongo5.PDF, Sound Board 834-5168 sheets 1 and 2, PDF pages 15 to 18, each a 1013 x 1318 8-bit JPEG at 120 dpi, flipped top to bottom"
sheets = "1-2"
dpi = 120
excerpt = "the audio path: every voice and both PSG outputs, through the two summers, to SOU"
prose = "docs/schematics/congo-percussion.md"

