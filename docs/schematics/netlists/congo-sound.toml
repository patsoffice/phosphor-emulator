# ---------------------------------------------------------------------------
# SHEET 1 (PDF pp15-16): THE PSG OUTPUTS, THE TWO SUMMERS, AND +6 V.
#
# The prose left open where SJ goes and worried that the drums' level against
# the PSGs depended on the PSG chain's output impedance. It does not. SJ is U12
# pin 13, the SECOND summer's virtual ground: every drum and the gorilla sum
# there through their own mixing resistors against R20 20k, and the PSGs arrive
# through R19 51k from the first summer. The whole balance is resistor ratios.
# ---------------------------------------------------------------------------

