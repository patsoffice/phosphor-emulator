# ===========================================================================
# THE TWO EXPLOSIONS (sheet 11, left half).
#
# The same envelope twice, at different time constants: a one-shot whose Qbar
# dumps a storage capacitor through a diode, and a long recovery to +5 V that
# sets the decay. Both feed an MB4391 through a follower.
#
# THE FOLLOWER DOES NOT TAP THE CAPACITOR. On both voices the recovery path is
# two resistors in series and the follower's non-inverting input sits on the
# junction BETWEEN them, with a filled dot. So what reaches the VCA is
# (5 V + V_cap) / 2, halved and offset, not the capacitor's own swing. The
# device holds each pair as one series value, which is right for the time
# constant and says nothing about the node.
# ===========================================================================

[[parts]]
group = "small explosion"
ref = "U22"
kind = "U"
device = "74123"
pins = ["1", "2", "3", "4", "13", "14", "15"]
out = ["4"]
read = "partial"
note = "Section A. Section B is not transcribed yet."
nc = [
  { pin = "13", why = "Q is drawn on the symbol with no pin number and no wire, as on every other 74123 here. Qbar on pin 4 is the driver." },
]

