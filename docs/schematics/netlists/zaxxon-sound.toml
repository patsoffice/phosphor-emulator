# ===========================================================================
# THE BATTLESHIP (sheet 11, left half into right half).
#
# Two relaxation oscillators of the same shape as the shot's, built out of one
# quad op-amp each. The slow one on U9 runs at a few hertz; the fast one on
# U10 is the audible voice. The slow one's output reaches nothing, which is a
# reading rather than a gap: see the note on `U10a out`.
#
# Every stage here repeats a pattern the shot also uses, which is the argument
# for transcribing both: a reference divider, a halving divider into the
# integrator's pin 5, a sink resistor onto pin 6, a Schmitt around the next
# section, and a transistor switch driven through a series diode with a base
# pulldown. Four copies on one board, with only the reference changing.
# ===========================================================================

[[parts]]
group = "battleship"
ref = "U9"
kind = "U"
device = "LM324"
device_inferred = true
pins = ["1", "2", "3", "5", "6", "7", "8", "9", "10", "12", "13", "14"]
out = ["1", "7", "8", "14"]
read = "partial"
drawing_says = "the fourth section's output is labeled pin 11"
note = """
THE DRAWING IS WRONG ON ONE PIN and this file departs from it. U9's fourth \
section is drawn with pin 12 on the non-inverting input, pin 13 on the \
inverting input and its output labeled 11. Pin 11 on a 14-pin quad is the \
negative supply and cannot drive anything. The identical section of the \
identical part U10, on the right half of the same sheet, is labeled 12, 13 \
and 14, and U9's other three sections sit on 1/2/3, 5/6/7 and 8/9/10 exactly \
as that package does. So this is a drafting slip on a single pin number and \
the output is pin 14. The previous transcription copied the 11 through \
without noticing that the two parts disagreed.

The part number is not printed. See the note on U19."""

