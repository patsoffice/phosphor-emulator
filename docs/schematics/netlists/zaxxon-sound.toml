# ===========================================================================
# THE ENGINE'S FILTER (sheet 12, across the overlap).
#
# A Sallen-Key low-pass between the engine's input stage and its VCA. The same
# topology as the explosion band-pass on sheet 11 right, with different values.
# ===========================================================================

[[parts]]
group = "base missile"
