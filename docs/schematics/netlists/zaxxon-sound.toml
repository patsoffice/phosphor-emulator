# ===========================================================================
# THE TWO EXPLOSIONS (sheet 11, left half).
#
# The same envelope twice, at different time constants: a one-shot whose Qbar
# dumps a storage capacitor through a diode, and a long recovery to +5 V that
# sets the decay. Both feed an MB4391 through a follower.
#
# THE FOLLOWER DOES NOT TAP THE CAPACITOR. On both voices the recovery path is
# two resistors in series and the follower's non-inverting input sits on the
# junction BETWEEN them, with a filled dot. So what reaches the VCA is
# (5 V + V_cap) / 2, halved and offset, not the capacitor's own swing. The
# device holds each pair as one series value, which is right for the time
# constant and says nothing about the node.
# ===========================================================================

[[parts]]
group = "small explosion"
ref = "U22"
kind = "U"
device = "74123"
pins = ["1", "2", "3", "4", "13", "14", "15"]
out = ["4"]
read = "partial"
note = "Section A. Section B is not transcribed yet."
nc = [
  { pin = "13", why = "Q is drawn on the symbol with no pin number and no wire, as on every other 74123 here. Qbar on pin 4 is the driver." },
]

[[parts.sections]]
name = "a"
pins = ["1", "2", "3", "4", "13", "14", "15"]
role = "one-shot"
group = "small explosion"

[[parts]]
group = "small explosion"
ref = "C60"
kind = "C"
uf = 1

[[parts]]
group = "small explosion"
ref = "R102"
kind = "R"
kohms = 36

[[parts]]
group = "small explosion"
ref = "R103"
kind = "R"
kohms = 1
note = "Pull-up on Qbar, which is open collector on this part."

[[parts]]
group = "small explosion"
ref = "D7"
kind = "D"
note = "Cathode toward Qbar, anode toward R106: the one-shot discharges C61 through it."

[[parts]]
group = "small explosion"
ref = "R106"
kind = "R"
kohms = 1
note = "The discharge path, so the envelope's attack."

[[parts]]
group = "small explosion"
ref = "C61"
kind = "C"
uf = 2.2
note = "The envelope storage capacitor."

[[parts]]
group = "small explosion"
ref = "R104"
kind = "R"
kohms = 470
block = "small explosion recovery"
note = """
R104 and R105 in series are the recovery path from +5 V, 940k against C61 for \
about 2.07 s. The follower taps BETWEEN them, so the envelope reaching the VCA \
is (5 + V_C61) / 2."""

[[parts]]
group = "small explosion"
ref = "R105"
kind = "R"
kohms = 470
block = "small explosion recovery"

[[parts]]
group = "medium explosion"
ref = "C62"
kind = "C"
uf = 3.3

[[parts]]
group = "medium explosion"
ref = "R107"
kind = "R"
kohms = 47

[[parts]]
group = "medium explosion"
ref = "R108"
kind = "R"
kohms = 1
note = "Pull-up on Qbar."

[[parts]]
group = "medium explosion"
ref = "D8"
kind = "D"
note = "Cathode toward Qbar, anode toward R212."

[[parts]]
group = "medium explosion"
ref = "R212"
kind = "R"
ohms = 470

[[parts]]
group = "medium explosion"
ref = "C63"
kind = "C"
uf = 1

[[parts]]
group = "medium explosion"
ref = "R109"
kind = "R"
mohms = 1
block = "medium explosion recovery"
note = """
R109 and R110 in series are the recovery path from +5 V, 2M against C63 for \
about 2.00 s, and the follower taps between them exactly as the small \
explosion's does."""

[[parts]]
group = "medium explosion"
ref = "R110"
kind = "R"
mohms = 1
block = "medium explosion recovery"

# --- explosion nets ---

[[nets]]
name = "S-EXP"
port = "input"
on = ["U22.1"]
note = "from the PPI on sheet 12, active low."

[[nets]]
name = "U22 Cext"
on = ["C60.a", "U22.14"]

[[nets]]
name = "U22 timing"
on = ["R102.b", "C60.b", "U22.15"]

[[nets]]
name = "small explosion Qbar"
on = ["U22.4", "R103.b", "D7.k"]

[[nets]]
name = "D7/R106 junction"
on = ["D7.a", "R106.a"]

[[nets]]
name = "small explosion envelope"
on = ["R106.b", "R105.b", "C61.a"]
note = "The storage node. The follower does not read it: it reads R104/R105's midpoint."

[[nets]]
name = "small explosion envelope tap"
on = ["R104.b", "R105.a", "U20.10"]
note = """
Where U20 section C's non-inverting input actually sits, with a filled dot. \
Halfway between +5 V and the capacitor, so the envelope is compressed into the \
top half of the range."""

[[nets]]
name = "small explosion CON"
on = ["U20.8", "U20.9", "U15.6"]
note = """
The follower's output, strapped to its own inverting input, driving U15 \
channel B's control pin. It crosses to sheet 11 right; the mix table assigns \
U15 channel B to the small explosion and a VCA's CON has no other driver."""

[[nets]]
name = "M-EXP"
port = "input"
on = ["U21.9"]
note = "from the PPI on sheet 12, active low."

[[nets]]
name = "U21b Cext"
on = ["C62.a", "U21.6"]

[[nets]]
name = "U21b timing"
on = ["R107.b", "C62.b", "U21.7"]

[[nets]]
name = "medium explosion Qbar"
on = ["U21.12", "R108.b", "D8.k"]

[[nets]]
name = "D8/R212 junction"
on = ["D8.a", "R212.a"]

[[nets]]
name = "medium explosion envelope"
on = ["R212.b", "R110.b", "C63.a"]

[[nets]]
name = "medium explosion envelope tap"
on = ["R109.b", "R110.a", "U20.12"]
note = "The same midpoint tap as the small explosion's."

[[nets]]
name = "medium explosion CON"
on = ["U20.14", "U20.13", "U13.6"]
note = """
Driving U13 channel B's control pin. The mix table assigns that channel to the \
medium explosion."""
