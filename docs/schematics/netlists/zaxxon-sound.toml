# ===========================================================================
# THE CANNON (sheet 11, left half).
#
# The one voice on this board whose envelope runs the other way, and the one
# whose pitch is swept by a transistor rather than a reference.
#
# ITS ONE-SHOT USES Q, NOT QBAR. Every other 74123 here drives its stage from
# Qbar on the falling edge; U45's pin 5 is Q, R126 is Q's pull-up, and D9 is
# turned around relative to D7 and D8. So the pulse CHARGES C79 rather than
# discharging it, and the envelope rises on the trigger instead of dropping.
#
# The filter is a band-pass with a bridged-T in its feedback: C81 and C82 in
# series from the inverting node to the output, with their midpoint pulled to
# ground through R130 and R133. Q6 sits across R133, so the envelope moves the
# resistance at that midpoint and with it the center frequency.
# ===========================================================================

[[parts]]
group = "cannon"
ref = "U45"
kind = "U"
device = "74123"
pins = ["5", "6", "7", "9", "10", "11", "12"]
out = ["5"]
read = "partial"
note = "Section B. Section A is not transcribed yet."
nc = [
  { pin = "12", why = "Qbar is drawn and connects to nothing. This is the one voice that takes Q instead, on pin 5, which is why its diode charges the envelope capacitor rather than discharging it." },
]

