# ===========================================================================
# THE PLAYER SHIP LEVEL (sheet 12, left half).
#
# Not a gate but a two-bit LEVEL, and the one place on this board where a
# plausible reading is wrong in a way nothing downstream would catch.
#
# R10 AND R11 ARE NOT IN THE LADDER. They are pull-ups on the two
# open-collector inverters, and on the drawing R11's vertical CROSSES node A's
# horizontal with no junction dot before landing on node B. That crossing is
# what makes the 2.2k pair look like ladder legs. The ladder proper is R12 from
# node A and R16 from node B, with R13 and R15 setting the range at node X and
# R14 coupling X down to Y.
# ===========================================================================

[[parts]]
group = "player ship level"
ref = "R10"
kind = "R"
kohms = 2.2
note = "Pull-up on U30 section E, not a ladder leg."

[[parts]]
group = "player ship level"
ref = "R11"
kind = "R"
kohms = 2.2
note = """
Pull-up on U30 section F, not a ladder leg. Its vertical crosses node A's \
horizontal with no junction dot on the way to node B, which is exactly how it \
gets misread into the ladder."""

[[parts]]
group = "player ship level"
ref = "R12"
kind = "R"
kohms = 6.8
note = "Node A's ladder leg."

[[parts]]
group = "player ship level"
ref = "R13"
kind = "R"
kohms = 82
block = "node X range"

[[parts]]
group = "player ship level"
ref = "R15"
kind = "R"
kohms = 56
block = "node X range"

[[parts]]
group = "player ship level"
ref = "R14"
kind = "R"
kohms = 36
note = "Couples node X down to node Y."

[[parts]]
group = "player ship level"
ref = "R16"
kind = "R"
kohms = 100
note = "Node B's ladder leg, and fifteen times node A's, which is why PA0 is the more significant bit."

[[parts]]
group = "player ship level"
ref = "C25"
kind = "C"
uf = 15
note = "Smooths node Y, so the level glides between steps rather than stepping."

[[nets]]
name = "player ship node A"
on = ["U30.10", "R10.b", "R12.a"]

[[nets]]
name = "player ship node B"
on = ["U30.12", "R11.b", "R16.a"]

[[nets]]
name = "player ship node X"
on = ["R12.b", "R13.b", "R14.a", "R15.a"]

[[nets]]
name = "player ship node Y"
on = ["R14.b", "R16.b", "C25.a", "U8.12"]
note = "The control level itself, which the follower passes to the opto's LED."

# ===========================================================================
# THE PLAYER SHIP ENGINE (sheet 12, left half).
#
# The one voice whose tuning element is not a resistor or a transistor but a
# light bulb. PC1 is an opto-coupler: the level ladder drives its LED through
# R17, and its photo-resistor sits on the midpoint of a bridged-T around U5,
# so the resonator's frequency follows how hard the LED is lit. That is how a
# two-bit PPI level becomes a continuously sliding engine note.
# ===========================================================================

[[parts]]
group = "engine"
ref = "R17"
kind = "R"
ohms = 390
note = "Sets the LED current, and so how far the engine's note slides."

[[parts]]
group = "engine"
ref = "PC1"
kind = "U"
device = "MCD-725H"
pins = ["led+", "led-", "cell1", "cell2"]
note = """
An opto-coupler drawn as two halves inside dashed outlines: an LED and a \
photo-resistor. THE DRAWING DOES NOT NUMBER ITS PINS, so these four names are \
this file's own. The part's resistance-against-current curve is not published, \
which makes it the second component on this board whose behavior is a genuine \
unknown rather than an unread fact."""

[[parts]]
ref = "U5"
kind = "U"
device = "LM324"
device_inferred = true
pins = ["1", "2", "3", "5", "6", "7", "8", "9", "10", "12", "13", "14"]
out = ["1", "7", "8", "14"]
read = "partial"
note = """
All four sections: the engine's resonator on the left half of this sheet, the \
two player ship tone filters on the right half, and section B, which is the \
homing missile's warble oscillator. That one is a relaxation oscillator rather \
than a filter: R43 is positive feedback from the output to the non-inverting \
input, R44 charges C43 from the output, and pin 6 watches the capacitor. The \
part number is not printed; see the note on U19."""

[[parts.sections]]
name = "a"
pins = ["1", "2", "3"]
role = "resonator"
group = "engine"

[[parts.sections]]
name = "c"
pins = ["8", "9", "10"]
role = "tone low-pass"
group = "player ship A"

[[parts.sections]]
name = "d"
pins = ["12", "13", "14"]
role = "tone low-pass"
group = "player ship B"

[[parts]]
group = "engine"
ref = "R21"
kind = "R"
kohms = 470
note = "Bridges the T, from U5 section A's inverting input to its output."

[[parts]]
group = "engine"
ref = "C26"
kind = "C"
uf = 0.01
block = "engine bridged-T"

[[parts]]
group = "engine"
ref = "C27"
kind = "C"
uf = 0.01
block = "engine bridged-T"

[[parts]]
group = "engine"
ref = "R20"
kind = "R"
kohms = 10

[[parts]]
group = "engine"
ref = "C28"
kind = "C"
uf = 2.2

[[parts]]
group = "engine"
ref = "R19"
kind = "R"
kohms = 10

[[parts]]
group = "engine"
ref = "R18"
kind = "R"
kohms = 200
note = "NOISE 1 into the engine's input stage."

[[parts]]
ref = "U4"
kind = "U"
device = "LM324"
device_inferred = true
pins = ["1", "2", "3", "5", "6", "7", "8", "9", "10", "12", "13", "14"]
out = ["1", "7", "8", "14"]
read = "partial"
note = """
All four sections, serving two voices. Section A on 1/2/3 is the engine's \
input stage. Section C on 8/9/10 is the engine's Sallen-Key low-pass, R61 and \
R62 in series with C50 to ground and C137 from their junction to the output, \
gain 1 + R63/R64 = 1.5 about +5 V. Section D on 12/13/14 is a unity follower \
of the homing missile's warble capacitor C43, and section B on 5/6/7 sums that \
follower through R45 against noise through R46 into R47, about +6 V, and drives \
the 555's control pin through C46.

The part number is not printed; see the note on U19."""

[[parts.sections]]
name = "a"
pins = ["1", "2", "3"]
role = "engine input"
group = "engine"

[[parts]]
group = "engine"
ref = "C29"
kind = "C"
uf = 2.2
note = """
Couples the resonator across to the right half of the sheet, into the player \
ship tone A filter."""

[[nets]]
name = "U8d out"
on = ["U8.14", "U8.13", "PC1.led+"]
note = "strapped output to inverting input: a follower of the level, driving the LED."

[[nets]]
name = "PC1 LED return"
on = ["PC1.led-", "R17.a"]

[[nets]]
name = "engine tuning node"
on = ["PC1.cell2", "C26.b", "C27.a", "R20.a"]
note = """
The bridged-T's midpoint, pulled toward +6 V through the photo-resistor. This \
is where the light does its work: the brighter the LED, the lower that \
resistance and the higher the resonator sits."""

[[nets]]
name = "U5a in"
on = ["U5.2", "R21.a", "C26.a"]

[[nets]]
name = "U5a out"
on = ["U5.1", "R21.b", "C27.b", "C29.a", "C38.a"]
note = """
THE OPTO-TUNED RESONATOR FEEDS BOTH PLAYER SHIP TONE FILTERS, not one each. \
C29 takes it into filter A and C38 into filter B, so the two differ only in \
their own values and in which MB4391 channel they reach. This file used to \
carry C38's source as unread and the two filters as unrelated."""

[[nets]]
name = "R20/C28 junction"
on = ["R20.b", "C28.b"]

[[nets]]
name = "U4a out"
on = ["C28.a", "R19.b", "U4.1"]
note = """
The engine input stage's output, with R19 closing the feedback around it and \
C28 carrying it on. This file used to call the net `R19/C28 junction` and mark \
the op-amp's own output unread, which had the stage drawn with no amplifier in \
it."""

[[nets]]
name = "U4a in"
on = ["R18.b", "R19.a", "U4.2"]

