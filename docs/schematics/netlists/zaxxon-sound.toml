# --- battleship nets ---

[[nets]]
name = "BATTLESHIP"
port = "input"
on = ["U30.5"]
note = "from the PPI on sheet 12, active low."

[[nets]]
name = "battleship gate"
on = ["U30.6", "R101.b", "U17.13"]

[[nets]]
name = "battleship reference"
on = ["R80.b", "R81.a", "U9.3"]

[[nets]]
name = "U9a out"
on = ["U9.1", "U9.2", "R82.a", "R83.a", "R90.a"]
note = "strapped output to inverting input, so a unity follower of the reference."

[[nets]]
name = "U9b summing node"
on = ["R82.b", "C56.a", "R85.b", "U9.6"]

[[nets]]
name = "U9b half"
on = ["R83.b", "R84.a", "U9.5"]

[[nets]]
name = "C56/C57 junction"
on = ["C56.b", "C57.a"]
note = "the two negative plates, facing each other."

[[nets]]
name = "U9b out"
on = ["U9.7", "C57.b", "U9.9", "R92.a"]

[[nets]]
name = "U9c window"
on = ["R86.b", "R88.a", "U9.10"]

[[nets]]
name = "U9c out"
on = ["U9.8", "R88.b", "R89.a"]

[[nets]]
name = "R89/D5 junction"
on = ["R89.b", "D5.a"]

[[nets]]
name = "Q4 base"
on = ["D5.k", "Q4.b", "R87.a"]

[[nets]]
name = "Q4 collector"
on = ["Q4.c", "R85.a"]

[[nets]]
name = "fast reference"
on = ["R90.b", "R91.a", "U9.12"]

[[nets]]
name = "U9d out"
on = ["U9.14", "U9.13", "U10.3"]
note = "strapped output to inverting input: a follower of the fast reference."

[[nets]]
name = "U10a out"
on = ["U10.1", "U10.2", "R92.b", "R93.a", "R94.a"]
note = """
Where the slow oscillator's R92 arrives, and the reason it modulates nothing. \
U10 section A is strapped output to inverting input, so it is a unity follower \
of the bias on its pin 3 and R92 can only load it."""

[[nets]]
name = "U10b summing node"
on = ["R93.b", "C58.a", "R96.b", "U10.6"]
note = "Pin 6, not pin 5. R96 crosses the pin-5 divider's vertical with no dot."

[[nets]]
name = "U10b half"
on = ["R94.b", "R95.a", "U10.5"]

[[nets]]
name = "U10b out"
on = ["U10.7", "C58.b", "U10.9"]

[[nets]]
name = "U10c window"
on = ["R98.b", "R99.a", "U10.10", "U10.12"]
note = """
U10 section D taps the Schmitt's hysteresis node here rather than its output \
on pin 8, which is one crossing lower on the sheet. That node swings by the \
window rather than by the whole output span, so the voice reaching the switch \
is much smaller than the op-amp's swing."""

[[nets]]
name = "U10c out"
on = ["U10.8", "R99.b", "R100.a"]

[[nets]]
name = "R100/D6 junction"
on = ["R100.b", "D6.a"]

[[nets]]
name = "Q5 base"
on = ["D6.k", "Q5.b", "R97.a"]

[[nets]]
name = "Q5 collector"
on = ["Q5.c", "R96.a"]

[[nets]]
name = "U10d out"
on = ["U10.14", "U10.13", "C59.a"]

[[nets]]
name = "U17 in"
on = ["C59.b", "U17.1"]

[[nets]]
name = "battleship leg"
on = ["U17.2", "R189.b", "R190.a", "R191.a"]

[[nets]]
name = "battleship attenuated"
on = ["R191.b", "R192.a", "C19.a"]

[[nets]]
name = "C19/R193 junction"
on = ["C19.b", "R193.a"]

[[nets]]
name = "SJ"
port = "output"
on = ["R193.b"]
note = """
The board's one summing junction, where all eleven legs meet. Only the \
battleship's is transcribed so far, so this reads as a port; it becomes an \
interior net once the mix is in."""
