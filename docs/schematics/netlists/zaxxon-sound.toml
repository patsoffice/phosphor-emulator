# ===========================================================================
# THE ALARMS (sheet 11, both halves).
#
# The only voice on this board that is not analog at all. A 556 free-runs at
# about 20 kHz, a 74393 divides it, and two of the divider's taps are gated by
# a 7426 and summed onto one leg. That is why the two alarms share a single
# leg in the mix and why the prose can corroborate them by naming 1QC and 1QD.
#
# The last stage is what makes the leg's absurd 0.0145 attenuation make sense:
# U12 section D is an inverting stage of -R173/R172 = -220, which saturates
# rail to rail, with C99 rolling its edges off at about 48 Hz.
# ===========================================================================

