ref = "R92"
kind = "R"
kohms = 30
note = """
THE PART THAT REACHES NOTHING. It leaves U9 section B's output and lands on \
the node where U10 section A's output, its own inverting input, R93 and R94 \
all meet. That section is strapped output to inverting input, so it is a unity \
follower of the bias on its pin 3 and R92 can only load it. The slow \
oscillator therefore does not modulate the fast one, and has no other output \
anywhere on the sheet. Traced three times. Either a drawing error or a \
vestigial part, but either way the drawing gives no modulation path."""

[[parts]]
