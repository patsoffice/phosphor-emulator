PA4, pulled up and active low, into the inverter that controls its 4016B
switch.

THIS FILE USED TO PUT U31 PIN 1 HERE AND IT IS NOT. U31's two buffers are
driven by U32's decoder outputs, which are the player ship level, and the
three gate bits each run straight down the sheet to their own destination:
this one to U30 pin 1, the base missile to U22 pin 9, the laser to U30 pin 3.
