NOT A REGULATED RAIL. R1 and R2 are a plain 1k divider from +12 V to ground \
with 470 uF across each half, and the drawing labels this midpoint +6 V. So \
every op-amp reference on both sheets shares one node behind 500 ohms."""

[[nets]]
