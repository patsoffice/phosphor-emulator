on = [
  "R148.b", "C89.b", "U18.1", "C90.b", "R155.b", "C91.b",
  "R158.b", "Q7.e", "R160.b", "R165.b", "C94.b", "R204.b",
  "R81.b", "R84.b", "R87.b", "Q4.e",
  "R91.b", "R95.b", "R97.b", "Q5.e",
  "R190.b", "R192.b",
  "C75.b", "R195.b", "C77.b", "R198.b", "C86.b", "R201.b", "R207.b",
  "U2.1", "U2.2", "C64.b", "C65.b",
