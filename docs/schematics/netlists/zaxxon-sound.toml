# ===========================================================================
# THE TWO PLAYER SHIP TONE FILTERS (sheet 12, right half).
#
# Equal-component Sallen-Key low-passes, gain 2 from an equal 2.2k pair, and
# the only filters on the board with that shape.
#
# THE SHUNT CAPACITOR'S LEFT END IS A CROSSING, NOT A JUNCTION. C30's and
# C39's horizontals run on past the node above them with no dot, so each
# capacitor returns to the rail rather than sitting across the second
# resistor. Read the other way those resistors and capacitors would carry no
# current at all, since the node beyond them is an op-amp input. This is the
# third crossing-without-a-dot on these sheets, after R10/R11 on the player
# ship ladder and R96/R70 on the oscillators.
#
# The corner confirms it: 1/(2*pi*100k*2200pF) is 723 Hz, which is the figure
# the prose's architecture already gives for these.
# ===========================================================================

