# ===========================================================================
# THE POWER-ON MUTE (sheet 12, right half).
#
# The board's reset, buffered, charging C13 through R7 so that the amplifier
# stays muted for a moment after power-on and does not thump. Two transistors
# in sequence: Q1 as an emitter follower of the delay node and Q2 as the
# switch it drives.
# ===========================================================================

[[parts]]
group = "mute"
ref = "R3"
kind = "R"
ohms = 330
note = "Pull-up for U31 section C's open-collector output."

[[parts]]
group = "mute"
ref = "D1"
kind = "D"
note = "Anode on the buffered reset, cathode toward R7, so the delay node can only be pulled up."

[[parts]]
group = "mute"
ref = "R7"
kind = "R"
kohms = 10
block = "mute delay"

[[parts]]
group = "mute"
ref = "C13"
kind = "C"
uf = 15
block = "mute delay"
note = "15 uF against R7's 10k and R8's 2.2M: the time the amplifier stays muted."

[[parts]]
group = "mute"
ref = "R8"
kind = "R"
mohms = 2.2
note = "Bleeds the delay node so the mute re-arms."

[[parts]]
group = "mute"
ref = "Q1"
kind = "Q"
device = "C1684"
out = ["e"]
note = "An emitter follower of the delay node, collector on +12 V."

[[parts]]
group = "mute"
ref = "R280"
kind = "R"
kohms = 1

[[parts]]
group = "mute"
ref = "R9"
kind = "R"
kohms = 100
note = "Q2's base pulldown."

[[parts]]
group = "mute"
ref = "Q2"
kind = "Q"
device = "C1684"
out = ["c"]
note = """
A common-emitter switch, emitter grounded. ITS COLLECTOR IS THE LA4460'S MUTE \
PIN, which this file used to record as a guess. Traced: the collector's wire \
runs straight up the right side of the sheet, turns left below the speaker \
connector and arrives at U1 pin 6. So the power-on delay on C13 holds the \
amplifier muted until Q1 turns Q2 on."""

[[nets]]
name = "reset buffered"
on = ["U31.6", "R3.b", "D1.a"]

[[nets]]
name = "mute delay"
on = ["D1.k", "R7.a"]

[[nets]]
name = "mute node"
on = ["R7.b", "C13.a", "R8.a", "Q1.b"]

[[nets]]
name = "Q1 emitter"
on = ["Q1.e", "R280.a"]

[[nets]]
name = "Q2 base"
on = ["R280.b", "R9.a", "Q2.b"]

[[nets]]
name = "MUTE"
on = ["Q2.c", "U1.6"]
note = """
The power-on mute, and the two ends of it used to be two unread pins in this \
file with a note saying they were probably the same wire. They are: Q2's \
collector runs up the right side of the sheet, turns left below the speaker \
connector and lands on the LA4460's MUTE pin."""

[[nets]]
name = "R34/R35 midpoint"
on = ["R34.b", "R35.a", "C36.b", "C37.a", "R22.a", "R36.a"]
note = """
A SECOND 6 V REFERENCE, AND THE TWO TONE FILTERS ARE WHAT IT IS FOR. R34 and \
R35 are 390 ohms each from +12 V to ground with 100 uF across each half, which \
is the R1/R2 divider built again at a tenth the impedance and beside the stage \
that uses it. Both player ship tone filters return their gain pair here rather \
than to the board-wide +6 V: R22 from one and R36 from the other.

The drawing does not label it, so this file still does not claim it is the same \
node as +6 V. It is not: R1/R2 sit behind 500 ohms shared by every op-amp on \
both sheets, and this one is 195 ohms serving two stages.

THE WIRE THAT CARRIES IT CROSSES TWO OTHERS WITH NO JUNCTION DOT, once under \
C29's input on the left half and once under the tone B source on the right. \
Both were settled at 1300 percent. Reading either as a junction shorts a \
filter's input to its own reference."""

[[nets]]
name = "player ship level 0"
on = ["U32.4", "U31.1"]
note = "the decoder's first output into its buffer. This used to be read as the homing missile's gate."

[[nets]]
name = "player ship level 1"
on = ["U32.5", "U31.3"]

[[nets]]
name = "player ship level 0 buffered"
on = ["U31.2", "R28.a"]

[[nets]]
name = "player ship level 0 envelope"
on = ["R28.b", "C34.a", "R29.a"]

[[nets]]
name = "player ship level 0 reference"
on = ["R29.b", "R30.b", "U11.10"]
note = """
Halfway between the envelope and +6 V, which is the same midpoint shape the two \
explosions use."""

[[nets]]
name = "player ship tone A CON"
on = ["U11.8", "U11.9", "U14.2"]
note = """
The follower's output, strapped to its own inverting input, driving U14 channel \
A's control pin. So the chain reads: U32 decodes player ship C and D, U31 \
buffers one output, R28 and C34 smooth it, R29 against R30 halves it toward \
+6 V, and this follower opens the VCA that carries the first tone filter.

THIS PIN HAS BEEN WRONG TWICE AND IS NOW TRACED RATHER THAN REASONED. The file \
first called the net the homing missile's, on the reasoning that U14 channel \
B's output runs to R180; that reading was corrected to R183, and the net was \
then renamed the engine's by the same indirect argument one step along. Both \
were inferences from the far end. Following the wire itself settles it: it \
leaves the strap, runs right, drops down a column at the right edge of the \
left half and continues across the overlap to U14 PIN 2, which is channel A.

Channel B's control on pin 6 is a different wire, leaving that pin downward, \
and it is still unread."""

[[nets]]
name = "base missile buffered"
on = ["U31.4", "R31.a"]

[[nets]]
name = "base missile envelope"
on = ["R31.b", "C35.a", "R32.a"]

[[nets]]
name = "base missile reference"
on = ["R32.b", "R33.b", "U11.5"]

[[nets]]
name = "player ship tone B CON"
on = ["U11.7", "U11.6", "U15.2"]
note = """
The second level's follower, driving U15 channel A's control pin. With the \
first follower on U14 channel A this completes the symmetry: two player ship \
levels, two tone filters, one VCA each.

This file used to call the net the base missile's, from the same habit of \
naming a follower after whichever voice its far end was assumed to serve."""

# ===========================================================================
# THE LASER (sheet 12, left half).
#
# The integrator-and-Schmitt oscillator for the FOURTH time on this board,
# built on U8 exactly as the battleship's two are on U9 and U10 and the shot's
# is on U19. Only the reference changes: here it is swept by a 555's timing
# capacitor rather than by a divider or a second 555's output.
#
# U7'S OUTPUT PIN IS NOT ON THE DRAWING. The symbol draws pins 1, 2, 4, 5, 6,
# 7 and 8 and simply does not draw pin 3, which is the whole reason this voice
# sweeps: the board reads the capacitor's ramp instead of the square. With pin
# 5 carrying C54 to ground the ramp runs a third to two thirds of the supply.
# ===========================================================================

[[parts]]
group = "laser"
ref = "U7"
kind = "U"
device = "555"
pins = ["1", "2", "4", "5", "6", "7", "8"]
note = """
PIN 3, THE OUTPUT, IS ABSENT FROM THE SYMBOL. That is a claim about the \
drawing and not an omission here: the board never uses this part's square \
wave, only the ramp on its timing capacitor, which is what U8 section A \
follows. Reset on pin 4 is tied up to the supply with pin 8, so it free-runs."""

[[parts]]
group = "laser"
ref = "R65"
kind = "R"
kohms = 5.1

[[parts]]
group = "laser"
ref = "R66"
kind = "R"
kohms = 22

[[parts]]
group = "laser"
ref = "D3"
kind = "D"
note = """
Across R66, cathode toward the capacitor, so the charge current bypasses R66 \
and the ramp is asymmetric: up through R65 alone, down through R66."""

[[parts]]
group = "laser"
ref = "C53"
kind = "C"
uf = 10
note = "The ramp the whole voice is swept by."

[[parts]]
group = "laser"
ref = "C54"
kind = "C"
uf = 0.01
note = "On the 555's control pin, which is what makes the ramp a third to two thirds."

[[parts]]
ref = "U8"
kind = "U"
device = "LM324"
device_inferred = true
pins = ["1", "2", "3", "5", "6", "7", "8", "9", "10", "12", "13", "14"]
out = ["1", "7", "8", "14"]
note = """
All four sections, and three of them are the laser's oscillator while the \
fourth is the player ship's level follower. The part number is not printed; \
see the note on U19."""

[[parts.sections]]
name = "a"
pins = ["1", "2", "3"]
role = "ramp follower"
group = "laser"

[[parts.sections]]
name = "b"
pins = ["5", "6", "7"]
role = "integrator"
group = "laser"

[[parts.sections]]
name = "c"
pins = ["8", "9", "10"]
role = "Schmitt"
group = "laser"

[[parts.sections]]
name = "d"
pins = ["12", "13", "14"]
role = "level follower"
group = "player ship level"

[[parts]]
group = "laser"
ref = "R67"
kind = "R"
kohms = 120

[[parts]]
group = "laser"
ref = "R68"
kind = "R"
kohms = 51
block = "laser halving divider"

[[parts]]
group = "laser"
ref = "R69"
kind = "R"
kohms = 51
block = "laser halving divider"

[[parts]]
group = "laser"
ref = "C138"
kind = "C"
uf = 0.01

[[parts]]
group = "laser"
ref = "R70"
kind = "R"
kohms = 47
note = """
The sink, onto U8 section B's pin 6, with the pin-5 divider crossing that \
vertical and no dot: the same junction that cost a pass on the battleship."""

[[parts]]
group = "laser"
ref = "R72"
kind = "R"
kohms = 51
block = "laser Schmitt window"

[[parts]]
group = "laser"
ref = "R73"
kind = "R"
kohms = 100
block = "laser Schmitt window"

[[parts]]
group = "laser"
ref = "R74"
kind = "R"
kohms = 10

[[parts]]
group = "laser"
ref = "D4"
kind = "D"
note = "Anode toward R74, cathode on Q3's base: D11, D5 and D6 again."

[[parts]]
group = "laser"
ref = "Q3"
kind = "Q"
device = "C1684"
out = ["c"]

[[parts]]
group = "laser"
ref = "R71"
kind = "R"
kohms = 2.2
note = "Q3's base pulldown: R160, R87 and R97 again."

[[nets]]
name = "U7 discharge"
on = ["R65.b", "R66.a", "U7.7", "D3.a"]

[[nets]]
name = "U7 ramp"
on = ["R66.b", "D3.k", "C53.a", "U7.2", "U7.6", "U8.3"]
note = """
The capacitor's own ramp, read directly by U8 section A. This is the node that \
stands in for the output pin the symbol does not draw."""

[[nets]]
name = "U7 control"
on = ["U7.5", "C54.a"]

[[nets]]
name = "U8a out"
on = ["U8.1", "U8.2", "R67.a", "R68.a"]
note = "strapped output to inverting input: a follower of the ramp."

[[nets]]
name = "U8b summing node"
on = ["R67.b", "C138.a", "R70.b", "U8.6"]

[[nets]]
name = "U8b half"
on = ["R68.b", "R69.a", "U8.5"]

[[nets]]
name = "U8b out"
on = ["U8.7", "C138.b", "U8.9"]

[[nets]]
name = "U8c window"
on = ["R72.b", "R73.a", "U8.10"]

[[nets]]
name = "U8c out"
on = ["U8.8", "R73.b", "R74.a", "R75.a"]
note = """
The oscillator's square. R75 carries it to the right half of this sheet, where \
R76 divides it and a 4016B gates it into the laser's leg."""

[[nets]]
name = "R74/D4 junction"
on = ["R74.b", "D4.a"]

[[nets]]
name = "Q3 base"
on = ["D4.k", "Q3.b", "R71.a"]

[[nets]]
name = "Q3 collector"
on = ["Q3.c", "R70.a"]

# ===========================================================================
# THE HOMING MISSILE (sheet 12, across the overlap).
#
# A 555 whose pitch is swept by a slow relaxation oscillator, gated by a 4016B
# rather than by a VCA. That is the difference from every other voice here:
# there is no MB4391 on this path at all, so the gate is the whole envelope
# and the voice has no decay.
#
# THE TWO HALVES OF SHEET 12 OVERLAP, so U6 is drawn on both: its timing side
# on the left half and its output side on the right. R61 and R62 appear twice
# the same way, with the same junction dot. Reading the halves as disjoint is
# how a part gets transcribed twice.
# ===========================================================================

[[parts]]
group = "homing missile"
ref = "R42"
kind = "R"
kohms = 51
note = "from +6 V into the warble oscillator's hysteresis node."

[[parts]]
group = "homing missile"
ref = "R43"
kind = "R"
kohms = 100
note = """
POSITIVE feedback, output to non-inverting input, which is what makes U5 \
section B an oscillator rather than an amplifier. Against R42's 51k it sets a \
window of a third of the output swing."""

[[parts]]
group = "homing missile"
ref = "R44"
kind = "R"
kohms = 6.8

[[parts]]
group = "homing missile"
ref = "C43"
kind = "C"
uf = 6.8
note = "the warble's timing capacitor, charged from U5 section B's output through R44. 46 ms."

[[parts]]
group = "homing missile"
ref = "C44"
kind = "C"
uf = 1
note = "couples NOISE 1 into the summing stage, so the swept tone carries a little noise."

[[parts]]
group = "homing missile"
ref = "R45"
kind = "R"
kohms = 68
note = """
The warble's leg into the summing stage, so a gain of -10/68 there. FIRST READ \
AS 6.8k AND CAUGHT BY THE VALUE LINT: the drawing writes this `68K` with no \
point, and the same hand writes `.01 UF` two inches away with its point \
perfectly plain, so the absence is the reading."""

[[parts]]
group = "homing missile"
ref = "R46"
kind = "R"
kohms = 200
note = "the noise leg, about three times weaker than the warble's 68k rather than the twenty-nine a 6.8k would have made it."

[[parts]]
group = "homing missile"
ref = "R47"
kind = "R"
kohms = 10
note = "the summing stage's feedback."

[[parts]]
group = "homing missile"
ref = "C46"
kind = "C"
uf = 33
note = """
Couples the summed sweep into the 555's control pin, which is what moves the \
pitch. Read as 3.3 uF first; the drawing writes `33UF` with two adjacent \
digits and no point. Caught by the value lint with R45 and R49."""

[[parts]]
group = "homing missile"
ref = "R48"
kind = "R"
kohms = 47
note = "+5 V to the 555's discharge pin: the charge leg."

[[parts]]
group = "homing missile"
ref = "R49"
kind = "R"
kohms = 68
note = """
Discharge pin to the timing node: the leg both halves of the cycle use. Read \
as 6.8k first and corrected by the value lint, as R45 was."""

[[parts]]
group = "homing missile"
ref = "C45"
kind = "C"
uf = 0.01
note = """
The 555's timing capacitor. With R48 47k and R49 68k it free-runs near 790 Hz, \
and C46 on the control pin sweeps that."""

[[parts]]
group = "homing missile"
ref = "U6"
kind = "U"
device = "555"
pins = ["1", "2", "3", "4", "5", "6", "7", "8"]
out = ["3"]
note = """
An astable on +5 V with pins 2 and 6 strapped, which is the ordinary way to \
run one. Pin 4 (reset) sits on +5 V with pin 8, so it free-runs and the gating \
is entirely downstream at U17.

DRAWN ON BOTH HALVES OF SHEET 12, because the scans overlap: pins 7, 6, 2 and \
the parts on them are on the left half and pins 3, 5 and 1 on the right."""

[[parts]]
group = "homing missile"
ref = "R50"
kind = "R"
kohms = 3.3
note = "+5 V above the 555's output, the top of the divider that sets the gated level."

[[parts]]
group = "homing missile"
ref = "R51"
kind = "R"
kohms = 12

[[parts]]
group = "homing missile"
ref = "R52"
kind = "R"
kohms = 3.3
note = "R51 against this takes about a fifth of the 555's swing on to the gate."

[[parts]]
group = "homing missile"
ref = "C47"
kind = "C"
uf = 10
note = "couples the divided square into the 4016B, so the switch passes AC about its own bias."

[[parts]]
group = "homing missile"
ref = "R53"
kind = "R"
kohms = 51

[[parts]]
group = "homing missile"
ref = "R54"
kind = "R"
kohms = 51
note = """
With R53 a plain halving divider on +12 V. It biases the 4016B's output at 6 V, \
which is what lets a switch pass a signal that swings both ways on a single \
supply."""

[[parts]]
group = "homing missile"
ref = "R55"
kind = "R"
kohms = 10
note = "the pull-up U30's open collector needs. Every gate inverter on this board has one."

[[nets]]
name = "R42/R43 junction"
on = ["R42.b", "R43.a", "U5.5"]
note = "the hysteresis node: +6 V through R42 against the output through R43."

[[nets]]
name = "U5b out"
on = ["U5.7", "R43.b", "R44.a"]

[[nets]]
name = "C43 node"
on = ["R44.b", "C43.a", "U5.6", "U4.12"]
note = """
The warble itself. U5 section B watches it on pin 6 and U4 section D follows \
it, so the same ramp both sustains the oscillation and leaves as the sweep."""

[[nets]]
name = "U4d out"
on = ["U4.14", "U4.13", "R45.a"]
note = "strapped output to inverting input: a unity follower of C43."

[[nets]]
name = "C44/R46 junction"
on = ["C44.b", "R46.a"]

[[nets]]
name = "U4b summing node"
on = ["R45.b", "R46.b", "R47.a", "U4.6"]

[[nets]]
name = "U4b out"
on = ["U4.7", "R47.b", "C46.a"]

[[nets]]
name = "U6 control"
on = ["C46.b", "U6.5"]
note = """
The 555's control pin, which is its upper threshold. This is the same trick \
the shot uses on U18, and here the modulation is the warble rather than an \
envelope."""

[[nets]]
name = "U6 discharge"
on = ["R48.b", "R49.a", "U6.7"]

[[nets]]
name = "U6 timing"
on = ["R49.b", "U6.6", "U6.2", "C45.a"]
note = "threshold and trigger strapped, which is the ordinary 555 astable."

[[nets]]
name = "U6 out"
on = ["U6.3", "R50.b", "R51.a"]

[[nets]]
name = "R51/R52 junction"
on = ["R51.b", "R52.a", "C47.a"]

[[nets]]
name = "C47/U17 junction"
on = ["C47.b", "U17.11"]

[[nets]]
name = "homing missile gate"
on = ["U30.2", "R55.b", "U17.12"]
note = "the open-collector inverter and its pull-up, driving the switch's control."

[[nets]]
name = "homing missile gate out"
on = ["U17.10", "R53.b", "R54.a", "R180.a"]
note = """
THE SWITCH'S OUTPUT AND ITS BIAS ON ONE NODE, and then straight to the mix \
leg. This voice has no VCA: R180 is the leg and the 4016B is the whole \
envelope."""

# ===========================================================================
# THE BASE MISSILE (sheet 12, left half).
#
# A one-shot, a diode that discharges a storage capacitor, and a follower that
# taps a MIDPOINT rather than the capacitor, which is the same shape the two
# explosions use.
# ===========================================================================

[[parts]]
group = "base missile"
ref = "C48"
kind = "C"
uf = 15
note = "the one-shot's timing capacitor, on U22 pins 6 and 7, positive plate on the pin 7 side."

[[parts]]
group = "base missile"
ref = "R56"
kind = "R"
kohms = 36
note = "with C48 a one-shot period near 240 ms."

[[parts]]
group = "base missile"
ref = "R57"
kind = "R"
kohms = 1
note = "the pull-up on Qbar's node, which is what lets the diode pull it down."

[[parts]]
group = "base missile"
ref = "D2"
kind = "D"
note = """
Cathode on the one-shot's Qbar, anode toward R58. So the envelope capacitor \
discharges INTO the one-shot while it is low, and the diode blocks when Qbar \
returns high, which is what makes the recovery slow and the attack fast."""

[[parts]]
group = "base missile"
ref = "R58"
kind = "R"
ohms = 470
note = "the discharge leg. With C49 it empties in about 7 ms."

[[parts]]
group = "base missile"
ref = "C49"
kind = "C"
uf = 15
note = "the envelope store."

[[parts]]
group = "base missile"
ref = "R59"
kind = "R"
kohms = 220

[[parts]]
group = "base missile"
ref = "R60"
kind = "R"
kohms = 220
note = """
R59 and R60 are equal, so the follower's tap is exactly halfway between +5 V \
and the capacitor: what reaches the VCA is (5 V + V_C49) / 2. They are also \
the only charging path, so the recovery the VCA sees is C49 against 440k, \
about 6.6 s."""

[[nets]]
name = "U22b Cext"
on = ["C48.a", "U22.6"]

[[nets]]
name = "U22b timing"
on = ["C48.b", "R56.b", "U22.7"]

[[nets]]
name = "base missile Qbar"
on = ["U22.12", "R57.b", "D2.k"]

[[nets]]
name = "D2/R58 junction"
on = ["D2.a", "R58.a"]

[[nets]]
name = "C49 node"
on = ["R58.b", "C49.a", "R60.b"]

[[nets]]
name = "R59/R60 junction"
on = ["R59.b", "R60.a", "U20.5"]
note = "the midpoint the follower taps, which is the finding on this voice."

[[nets]]
name = "base missile CON"
on = ["U20.7", "U20.6", "U14.6"]
note = """
Strapped output to inverting input, so a unity follower of the R59/R60 \
midpoint, driving U14 channel B's control pin. That is what settles which \
voice channel B carries: its control is the base missile's envelope, so its \
input through C51 is the base missile's noise band-pass and its output is the \
base missile's leg."""

