# ===========================================================================
# THE MB4391 VCA CHANNELS AND THEIR MIX LEGS (sheet 11, right half).
#
# Four channels across three packages, and the reason this group was
# transcribed early: EVERY ONE OF THEM HAS 680 pF ON THE PIN THE DRAWING
# LABELS `RO`, and none of the four is in the device. C94 was found by
# accident; C75, C77 and C86 are its siblings, and they are here so that the
# parts-not-modeled query names all four without being told the class exists.
#
# The package spans voices, which is why sections carry their own group: U13
# runs the medium explosion on channel B and the cannon on channel A. Channel A
# is pins 1 (IN), 2 (CON), 14 (RO), 15 (OUT); channel B is 5, 6, 10, 11.
#
