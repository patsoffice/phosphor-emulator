# ===========================================================================
# THE LASER (sheet 12, left half).
#
# The integrator-and-Schmitt oscillator for the FOURTH time on this board,
# built on U8 exactly as the battleship's two are on U9 and U10 and the shot's
# is on U19. Only the reference changes: here it is swept by a 555's timing
# capacitor rather than by a divider or a second 555's output.
#
# U7'S OUTPUT PIN IS NOT ON THE DRAWING. The symbol draws pins 1, 2, 4, 5, 6,
# 7 and 8 and simply does not draw pin 3, which is the whole reason this voice
# sweeps: the board reads the capacitor's ramp instead of the square. With pin
# 5 carrying C54 to ground the ramp runs a third to two thirds of the supply.
# ===========================================================================

[[parts]]
group = "laser"
ref = "U7"
kind = "U"
device = "555"
pins = ["1", "2", "4", "5", "6", "7", "8"]
note = """
PIN 3, THE OUTPUT, IS ABSENT FROM THE SYMBOL. That is a claim about the \
drawing and not an omission here: the board never uses this part's square \
wave, only the ramp on its timing capacitor, which is what U8 section A \
follows. Reset on pin 4 is tied up to the supply with pin 8, so it free-runs."""

