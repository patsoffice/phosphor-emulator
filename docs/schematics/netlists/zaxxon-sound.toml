# ===========================================================================
# THE NOISE SOURCE (sheet 11, left half into right half).
#
# One MM5837 shift-register noise generator feeding the whole board. NOISE 1
# is its raw output and also crosses to sheet 12; NOISE 2 is NOISE 1 through
# an inverting stage of 0.1, which is attenuation rather than gain because the
# part's output is a logic-level swing.
# ===========================================================================

