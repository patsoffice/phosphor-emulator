ref = "C56"
kind = "C"
uf = 3.3
block = "slow integrator cap"
note = """
C56 and C57 are in series BACK TO BACK, positive plates on the outside, which \
makes a non-polarized 1.65 uF out of two electrolytics. The integrator's node \
swings both ways, so a single polarized part would be wrong here. Both are \
3.3 uF 16 V."""

