ref = "R120"
kind = "R"
kohms = 100

[[parts]]
group = "medium explosion"
ref = "R121"
kind = "R"
kohms = 150
note = "with R120 a gain of 1 + 150/100 = 2.5, the same as R114 and R115 give the other chain."

[[parts]]
