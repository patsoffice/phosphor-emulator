# ---------------------------------------------------------------------------
# THE SECOND EXPLOSION'S BAND-PASS (sheet 11, right half).
#
# The same Sallen-Key as above with an inverting stage in front of it and a
# halving divider behind. FOUND BY TRACING C76's SOURCE: this file claimed
# every part was transcribed and these twelve were not, which is exactly the
# class of gap the format exists to make visible.
# ---------------------------------------------------------------------------

[[parts]]
group = "medium explosion"
ref = "C67"
kind = "C"
uf = 10
note = """
Couples NOISE 1, the generator's raw output, into this chain. Its sibling \
takes NOISE 2 instead, which is the same noise after an amplifier, so the two \
explosion voices differ in their source as well as in the stage and divider \
around their filters."""

[[parts]]
group = "medium explosion"
ref = "R117"
kind = "R"
kohms = 330

[[parts]]
group = "medium explosion"
ref = "R118"
kind = "R"
kohms = 100
note = "feedback around U3 section B, so the stage is -100/330 about +6 V."

[[parts]]
group = "medium explosion"
ref = "C69"
kind = "C"
uf = 2.2

[[parts]]
group = "medium explosion"
ref = "R119"
kind = "R"
kohms = 15

[[parts]]
group = "medium explosion"
ref = "R122"
kind = "R"
kohms = 15

[[parts]]
