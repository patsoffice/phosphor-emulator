  { pin = "3", why = "the output is drawn with its pin number and a stub and reaches nothing: the warble is the timing ramp, not the square" },
]
note = """
The warble timer, on +5 V with reset tied to +5 V, so it runs whenever the \
saucer's hold switch lets its timing node move. Designated by grid location: \
this R10 is a 555, not a resistor."""

[[parts]]
